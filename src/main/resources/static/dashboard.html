<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CareerX | Candidate Dashboard</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/careerx.css">

    <style>

        /* =====================================================
           CANDIDATE DASHBOARD
           ===================================================== */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: #f8fafc;
            background: #050914;
            overflow-x: hidden;
        }

        /* =====================================================
           BACKGROUND
           ===================================================== */

        .dashboard-background {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(0, 229, 255, 0.07),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 85% 75%,
                    rgba(99, 102, 241, 0.09),
                    transparent 32%
                ),
                #050914;
        }

        .dashboard-grid {
            position: absolute;
            inset: 0;
            opacity: 0.28;

            background-image:
                linear-gradient(
                    rgba(0, 229, 255, 0.045) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(0, 229, 255, 0.045) 1px,
                    transparent 1px
                );

            background-size: 55px 55px;

            mask-image:
                linear-gradient(
                    to bottom,
                    black,
                    transparent 90%
                );
        }

        .dashboard-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.18;

            animation:
                dashboardFloat 10s ease-in-out infinite;
        }

        .dashboard-orb-one {
            width: 320px;
            height: 320px;
            top: -140px;
            left: 180px;
            background: #00e5ff;
        }

        .dashboard-orb-two {
            width: 350px;
            height: 350px;
            right: -160px;
            bottom: -140px;
            background: #7c3aed;
            animation-delay: -4s;
        }

        @keyframes dashboardFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-25px);
            }

        }

        /* =====================================================
           APP LAYOUT
           ===================================================== */

        .app-container {
            display: flex;
            min-height: 100vh;
        }

        /* =====================================================
           SIDEBAR
           ===================================================== */

        .sidebar {
            position: fixed;

            top: 0;
            left: 0;
            bottom: 0;

            width: 255px;

            padding: 28px 18px;

            background:
                linear-gradient(
                    180deg,
                    rgba(8, 17, 34, 0.97),
                    rgba(4, 10, 22, 0.97)
                );

            border-right:
                1px solid
                rgba(0, 229, 255, 0.10);

            box-shadow:
                15px 0 50px
                rgba(0, 0, 0, 0.20);

            backdrop-filter: blur(20px);

            z-index: 20;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 11px;

            padding:
                0 12px 28px;

            color: white;

            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .sidebar-brand::before {
            content: "X";

            width: 36px;
            height: 36px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            color: #04111c;

            font-size: 0.95rem;
            font-weight: 900;

            background:
                linear-gradient(
                    135deg,
                    #00e5ff,
                    #6366f1
                );

            box-shadow:
                0 0 22px
                rgba(0, 229, 255, 0.30);
        }

        .sidebar-brand span {
            color: #00e5ff;
        }

        /* =====================================================
           SIDEBAR MENU
           ===================================================== */

        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar-menu li {
            margin-bottom: 6px;
        }

        .sidebar-menu a {
            position: relative;

            display: flex;
            align-items: center;
            gap: 12px;

            padding: 12px 14px;

            border-radius: 11px;

            color: #94a3b8;

            text-decoration: none;

            font-size: 0.82rem;
            font-weight: 600;

            transition: 0.25s ease;
        }

        .sidebar-menu a::before {
            content: "";

            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #334155;

            transition: 0.25s ease;
        }

        .sidebar-menu a:hover {
            color: #e2e8f0;

            background:
                rgba(0, 229, 255, 0.05);

            transform:
                translateX(3px);
        }

        .sidebar-menu a:hover::before {
            background: #00e5ff;

            box-shadow:
                0 0 10px #00e5ff;
        }

        .sidebar-menu a.active {
            color: #67e8f9;

            background:
                linear-gradient(
                    90deg,
                    rgba(0, 229, 255, 0.10),
                    rgba(99, 102, 241, 0.06)
                );

            border:
                1px solid
                rgba(0, 229, 255, 0.10);

            box-shadow:
                inset 3px 0 0 #00e5ff;
        }

        .sidebar-menu a.active::before {
            background: #00e5ff;

            box-shadow:
                0 0 10px #00e5ff;
        }

        /* =====================================================
           MAIN CONTENT
           ===================================================== */

        .main-content {
            width: calc(100% - 255px);

            margin-left: 255px;

            padding:
                35px 40px 50px;
        }

        /* =====================================================
           HEADER
           ===================================================== */

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 30px;
            padding-bottom: 22px;

            border-bottom:
                1px solid
                rgba(100, 116, 139, 0.12);
        }

        .page-title {
            margin: 0;

            color: #f8fafc;

            font-size:
                clamp(1.5rem, 3vw, 2rem);

            font-weight: 800;
            letter-spacing: -0.7px;
        }

        .user-name-display {
            background:
                linear-gradient(
                    90deg,
                    #00e5ff,
                    #6366f1,
                    #a855f7
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* =====================================================
           DASHBOARD CARDS
           ===================================================== */

        .dashboard-cards {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 18px;

            margin-bottom: 25px;
        }

        .stat-card {
            position: relative;

            padding: 22px;

            min-height: 125px;

            border-radius: 17px;

            overflow: hidden;

            background:
                linear-gradient(
                    145deg,
                    rgba(15, 29, 52, 0.92),
                    rgba(5, 13, 27, 0.94)
                );

            border:
                1px solid
                rgba(79, 124, 255, 0.13);

            box-shadow:
                0 15px 45px
                rgba(0, 0, 0, 0.20);

            transition: 0.3s ease;
        }

        .stat-card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 3px;

            background:
                linear-gradient(
                    90deg,
                    #00e5ff,
                    #6366f1,
                    #a855f7
                );

            box-shadow:
                0 0 15px
                rgba(0, 229, 255, 0.30);
        }

        .stat-card:hover {
            transform:
                translateY(-5px);

            border-color:
                rgba(0, 229, 255, 0.25);

            box-shadow:
                0 20px 55px
                rgba(0, 229, 255, 0.07);
        }

        .stat-card h3 {
            margin: 5px 0 9px;

            font-size: 2rem;
            font-weight: 800;

            background:
                linear-gradient(
                    90deg,
                    #00e5ff,
                    #6366f1
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-card p {
            margin: 0;

            color: #94a3b8;

            font-size: 0.78rem;
            font-weight: 600;
        }

        /* =====================================================
           PROFILE SUMMARY
           ===================================================== */

        .content-card {
            position: relative;

            padding: 26px;

            border-radius: 18px;

            background:
                linear-gradient(
                    145deg,
                    rgba(15, 27, 49, 0.94),
                    rgba(5, 12, 25, 0.95)
                );

            border:
                1px solid
                rgba(79, 124, 255, 0.14);

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.22);

            overflow: hidden;
        }

        .content-card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 2px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #00e5ff,
                    #6366f1,
                    transparent
                );

            opacity: 0.75;
        }

        .card-header {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 22px;

            padding-bottom: 17px;

            border-bottom:
                1px solid
                rgba(100, 116, 139, 0.12);
        }

        .card-header h3 {
            margin: 0;

            color: #f1f5f9;

            font-size: 1rem;
            font-weight: 750;
        }

        /* =====================================================
           EDIT PROFILE BUTTON
           ===================================================== */

        .btn {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            border: none;

            text-decoration: none;

            cursor: pointer;

            font-family: inherit;

            transition: 0.25s ease;
        }

        .btn-sm {
            padding:
                9px 15px;

            border-radius: 9px;

            font-size: 0.76rem;
            font-weight: 700;
        }

        .btn-primary {
            color: #04111c;

            background:
                linear-gradient(
                    135deg,
                    #00e5ff,
                    #6366f1
                );

            box-shadow:
                0 7px 20px
                rgba(0, 229, 255, 0.12);
        }

        .btn-primary:hover {
            transform:
                translateY(-2px);

            box-shadow:
                0 10px 28px
                rgba(0, 229, 255, 0.22);
        }

        /* =====================================================
           PROFILE SUMMARY CONTENT
           ===================================================== */

        #profileSummaryContent {
            color: #cbd5e1;

            font-size: 0.88rem;

            line-height: 1.8;
        }

        #profileSummaryContent p {
            margin: 0;
        }

        .empty-state {
            padding: 22px;

            border-radius: 12px;

            color: #94a3b8;

            background:
                rgba(0, 229, 255, 0.035);

            border:
                1px dashed
                rgba(0, 229, 255, 0.15);
        }

        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (max-width: 1050px) {

            .dashboard-cards {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }

        @media (max-width: 800px) {

            .sidebar {
                position: relative;

                width: 100%;

                min-height: auto;

                padding: 18px;

                border-right: none;

                border-bottom:
                    1px solid
                    rgba(0, 229, 255, 0.10);
            }

            .app-container {
                display: block;
            }

            .sidebar-brand {
                padding:
                    0 8px 18px;
            }

            .sidebar-menu {
                display: flex;

                flex-wrap: wrap;

                gap: 6px;
            }

            .sidebar-menu li {
                margin: 0;
            }

            .sidebar-menu a {
                padding:
                    9px 11px;
            }

            .main-content {
                width: 100%;

                margin-left: 0;

                padding:
                    25px 20px 40px;
            }

        }

        @media (max-width: 600px) {

            .dashboard-cards {
                grid-template-columns: 1fr;
            }

            .header {
                align-items: flex-start;

                flex-direction: column;
            }

            .card-header {
                align-items: flex-start;

                flex-direction: column;
            }

            .btn-sm {
                width: 100%;
            }

        }

    </style>

</head>

<body>

    <!-- =====================================================
         BACKGROUND
         ===================================================== -->

    <div class="dashboard-background">

        <div class="dashboard-grid"></div>

        <div class="dashboard-orb dashboard-orb-one"></div>

        <div class="dashboard-orb dashboard-orb-two"></div>

    </div>

    <!-- =====================================================
         APPLICATION
         ===================================================== -->

    <div class="app-container">

        <!-- =================================================
             SIDEBAR
             ================================================= -->

        <aside class="sidebar">

            <div class="sidebar-brand">
                Career<span>X</span>
            </div>

            <ul class="sidebar-menu">

                <li>
                    <a href="dashboard.html"
                       class="active">
                        Dashboard
                    </a>
                </li>

                <li>
                    <a href="profile.html">
                        Profile Settings
                    </a>
                </li>

                <li>
                    <a href="jobs.html">
                        Browse Jobs
                    </a>
                </li>

                <li>
                    <a href="candidate-applications.html">
                        My Applications
                    </a>
                </li>

                <li>
                    <a href="candidate-interviews.html">
                        My Interviews
                    </a>
                </li>

                <li>
                    <a href="#"
                       id="logoutBtn">
                        Logout
                    </a>
                </li>

            </ul>

        </aside>

        <!-- =================================================
             MAIN CONTENT
             ================================================= -->

        <main class="main-content">

            <header class="header">

                <h1 class="page-title">

                    Welcome,
                    <span class="user-name-display">
                        Candidate
                    </span>!

                </h1>

            </header>

            <!-- =================================================
                 STATISTICS
                 ================================================= -->

            <div class="dashboard-cards">

                <div class="stat-card">

                    <h3 id="skillsCount">
                        0
                    </h3>

                    <p>
                        Skills Added
                    </p>

                </div>

                <div class="stat-card">

                    <h3 id="eduCount">
                        0
                    </h3>

                    <p>
                        Education Records
                    </p>

                </div>

                <div class="stat-card">

                    <h3 id="expCount">
                        0
                    </h3>

                    <p>
                        Experience Records
                    </p>

                </div>

                <div class="stat-card">

                    <h3 id="resumeStatus">
                        No
                    </h3>

                    <p>
                        Resume Uploaded
                    </p>

                </div>

            </div>

            <!-- =================================================
                 PROFILE SUMMARY
                 ================================================= -->

            <div class="content-card">

                <div class="card-header">

                    <h3>
                        Profile Summary
                    </h3>

                    <a href="profile.html"
                       class="btn btn-sm btn-primary">

                        Edit Profile

                    </a>

                </div>

                <div id="profileSummaryContent">

                    <p class="text-muted">
                        Loading...
                    </p>

                </div>

            </div>

        </main>

    </div>

    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="js/app.js"></script>

    <script>

        document.addEventListener(
            'DOMContentLoaded',
            async () => {

                const user = await checkAuth();

                if (!user) {
                    return;
                }

                const candidateId = user.id;

                /*
                 * Load dashboard statistics from the
                 * dedicated API endpoints.
                 *
                 * These are used instead of:
                 * user.candidateSkills
                 * user.educations
                 * user.experiences
                 * user.resumes
                 *
                 * because those relationships are hidden
                 * from /api/candidates/me using @JsonIgnore.
                 */

                try {

                    const [
                        skillsResponse,
                        educationResponse,
                        experienceResponse,
                        resumeResponse
                    ] = await Promise.all([

                        fetch(
                            `/api/candidates/${candidateId}/skills`
                        ),

                        fetch(
                            `/api/candidates/${candidateId}/education`
                        ),

                        fetch(
                            `/api/candidates/${candidateId}/experience`
                        ),

                        fetch(
                            `/api/candidates/${candidateId}/resume`
                        )

                    ]);

                    /*
                     * Handle unauthorized requests.
                     */

                    if (
                        skillsResponse.status === 401 ||
                        educationResponse.status === 401 ||
                        experienceResponse.status === 401 ||
                        resumeResponse.status === 401
                    ) {
                        window.location.href = '/index.html';
                        return;
                    }

                    /*
                     * Convert responses to JSON.
                     */

                    const skills =
                        skillsResponse.ok
                            ? await skillsResponse.json()
                            : [];

                    const education =
                        educationResponse.ok
                            ? await educationResponse.json()
                            : [];

                    const experience =
                        experienceResponse.ok
                            ? await experienceResponse.json()
                            : [];

                    const resumes =
                        resumeResponse.ok
                            ? await resumeResponse.json()
                            : [];

                    /*
                     * Update dashboard counts.
                     */

                    document.getElementById(
                        'skillsCount'
                    ).textContent = Array.isArray(skills)
                        ? skills.length
                        : 0;

                    document.getElementById(
                        'eduCount'
                    ).textContent = Array.isArray(education)
                        ? education.length
                        : 0;

                    document.getElementById(
                        'expCount'
                    ).textContent = Array.isArray(experience)
                        ? experience.length
                        : 0;

                    document.getElementById(
                        'resumeStatus'
                    ).textContent =
                        Array.isArray(resumes) &&
                        resumes.length > 0
                            ? 'Yes'
                            : 'No';

                } catch (error) {

                    console.error(
                        'Failed to load dashboard statistics:',
                        error
                    );

                    /*
                     * Keep the default values if
                     * an API request fails.
                     */

                    document.getElementById(
                        'skillsCount'
                    ).textContent = '0';

                    document.getElementById(
                        'eduCount'
                    ).textContent = '0';

                    document.getElementById(
                        'expCount'
                    ).textContent = '0';

                    document.getElementById(
                        'resumeStatus'
                    ).textContent = 'No';
                }

                /*
                 * Profile summary still comes from
                 * /api/candidates/me.
                 */

                const summaryDiv =
                    document.getElementById(
                        'profileSummaryContent'
                    );

                if (user.profileSummary) {

                    /*
                     * Escape HTML to avoid inserting
                     * raw user-provided HTML.
                     */

                    const tempDiv =
                        document.createElement('div');

                    tempDiv.textContent =
                        user.profileSummary;

                    summaryDiv.innerHTML =
                        `<p>${tempDiv.innerHTML}</p>`;

                } else {

                    summaryDiv.innerHTML = `
                        <p class="empty-state">

                            No profile summary added yet.
                            Update your profile to stand out
                            to recruiters.

                        </p>
                    `;

                }

            }
        );

    </script>

</body>

</html>
