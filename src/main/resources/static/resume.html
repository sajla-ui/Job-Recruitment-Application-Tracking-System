<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Resume</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .profile-nav { display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; }
        .profile-nav a { text-decoration: none; color: var(--text-muted); font-weight: 500; padding: 0.5rem 1rem; border-radius: 5px; }
        .profile-nav a.active { background-color: rgba(67, 97, 238, 0.1); color: var(--primary-color); }
        .file-drop-area { border: 2px dashed var(--border-color); padding: 3rem; text-align: center; border-radius: 10px; background: #fafafa; margin-bottom: 1rem;}
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">Job Portal</div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="profile.html" class="active">Profile Settings</a></li>
                <li><a href="jobs.html">Browse Jobs</a></li>
                <li><a href="#" id="logoutBtn">Logout</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <header class="header">
                <h1 class="page-title">Resume Management</h1>
            </header>
            
            <div id="alertMessage" class="alert"></div>

            <div class="profile-nav">
                <a href="profile.html">Basic Info</a>
                <a href="skills.html">Skills</a>
                <a href="education.html">Education</a>
                <a href="experience.html">Experience</a>
                <a href="resume.html" class="active">Resume</a>
            </div>

            <div class="content-card">
                <div class="card-header">
                    <h3>Upload Resume</h3>
                </div>
                <form id="resumeForm" enctype="multipart/form-data">
                    <div class="file-drop-area">
                        <input type="file" id="resumeFile" name="file" accept=".pdf,.doc,.docx" required>
                        <p class="text-muted" style="margin-top:1rem;">Supported formats: PDF, DOC, DOCX (Max 5MB)</p>
                    </div>
                    <button type="submit" class="btn btn-primary" id="uploadBtn">Upload File</button>
                </form>
            </div>

            <div class="content-card">
                <h3>Uploaded Resumes</h3>
                <div id="resumeList" style="margin-top: 1.5rem;">
                    <!-- Populated via JS -->
                </div>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script>
        let currentUser = null;
        
        document.addEventListener('DOMContentLoaded', async () => {
            currentUser = await checkAuth();
            if (currentUser) {
                renderResumes(currentUser.resumes);
            }
        });

        function renderResumes(resumes) {
            const container = document.getElementById('resumeList');
            if (!resumes || resumes.length === 0) {
                container.innerHTML = '<div class="empty-state">No resumes uploaded yet.</div>';
                return;
            }
            container.innerHTML = resumes.map(res => `
                <div style="display:flex; justify-content:space-between; align-items:center; padding: 1rem; border: 1px solid var(--border-color); border-radius:5px; margin-bottom:1rem;">
                    <div>
                        <h4 style="margin:0 0 0.2rem 0; color:var(--primary-color);">📄 ${res.fileName}</h4>
                        <span class="text-muted" style="font-size:0.8rem;">Uploaded on: ${new Date(res.uploadDate).toLocaleString()}</span>
                    </div>
                    <div>
                        <button onclick="deleteResume(${res.id})" class="btn btn-sm btn-danger">Delete File</button>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('resumeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('uploadBtn');
            btn.textContent = 'Uploading...';
            btn.disabled = true;

            const fileInput = document.getElementById('resumeFile');
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                const response = await fetch(`/api/candidates/${currentUser.id}/resume`, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    fileInput.value = '';
                    showAlert('Resume uploaded successfully!', 'success');
                    currentUser = await checkAuth(); // Refresh UI
                    renderResumes(currentUser.resumes);
                } else {
                    showAlert('Upload failed. Ensure file is within limits.');
                }
            } catch (error) {
                showAlert('An error occurred during upload.');
            } finally {
                btn.textContent = 'Upload File';
                btn.disabled = false;
            }
        });

        async function deleteResume(id) {
            if(!confirm('Are you sure you want to delete this resume?')) return;
            try {
                const response = await fetch(`/api/candidates/${currentUser.id}/resume/${id}`, { method: 'DELETE' });
                if(response.ok) {
                    showAlert('Resume deleted', 'success');
                    currentUser = await checkAuth();
                    renderResumes(currentUser.resumes);
                } else {
                    showAlert('Failed to delete resume');
                }
            } catch (error) {
                showAlert('Error deleting resume');
            }
        }
    </script>
</body>
</html>
