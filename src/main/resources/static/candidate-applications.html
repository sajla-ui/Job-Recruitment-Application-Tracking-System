<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Applications</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        /* =====================================================
           APPLICATION PAGE
           ===================================================== */

        .applications-summary {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(180px, 1fr));

            gap: 18px;

            margin-bottom: 25px;
        }


        .application-stat {
            position: relative;

            padding: 20px;

            border-radius: var(--radius);

            background:
                linear-gradient(
                    145deg,
                    rgba(18, 30, 55, 0.92),
                    rgba(8, 16, 32, 0.88)
                );

            border:
                1px solid var(--border);

            box-shadow:
                var(--shadow);

            overflow: hidden;

            transition: 0.3s ease;
        }


        .application-stat::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 3px;

            background:
                linear-gradient(
                    90deg,
                    var(--blue),
                    var(--cyan),
                    var(--purple)
                );

            box-shadow:
                0 0 15px var(--cyan);
        }


        .application-stat:hover {
            transform: translateY(-5px);

            border-color:
                var(--border-bright);

            box-shadow:
                var(--shadow-hover);
        }


        .application-stat-number {
            font-size: 2rem;

            font-weight: 800;

            background:
                linear-gradient(
                    90deg,
                    var(--cyan),
                    var(--primary),
                    var(--purple)
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }


        .application-stat-label {
            margin-top: 5px;

            color: var(--text-light);

            font-size: 0.85rem;
        }


        /* =====================================================
           APPLICATION LIST
           ===================================================== */

        .applications-list {
            display: flex;

            flex-direction: column;

            gap: 18px;
        }


        .application-card {
            position: relative;

            overflow: hidden;

            background:
                linear-gradient(
                    145deg,
                    rgba(18, 29, 52, 0.95),
                    rgba(7, 14, 28, 0.92)
                );

            padding: 24px;

            border-radius: var(--radius);

            border:
                1px solid var(--border);

            box-shadow:
                var(--shadow);

            transition: 0.3s ease;
        }


        .application-card::before {
            content: "";

            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 3px;

            background:
                linear-gradient(
                    90deg,
                    var(--blue),
                    var(--cyan),
                    var(--purple)
                );

            box-shadow:
                0 0 15px var(--cyan);
        }


        .application-card:hover {
            transform:
                translateY(-4px);

            border-color:
                rgba(0, 229, 255, 0.3);

            box-shadow:
                var(--shadow-hover);
        }


        .application-header {
            display: flex;

            justify-content:
                space-between;

            align-items:
                flex-start;

            gap: 20px;

            margin-bottom: 20px;
        }


        .application-job-title {
            margin: 0 0 7px;

            color: var(--cyan);

            font-size: 1.25rem;

            font-weight: 750;

            text-shadow:
                0 0 15px rgba(0, 229, 255, 0.15);
        }


        .application-company {
            color: #e2e8f0;

            font-size: 0.95rem;

            font-weight: 650;
        }


        /* =====================================================
           STATUS
           ===================================================== */

        .application-status {
            display: inline-flex;

            align-items: center;

            gap: 7px;

            padding: 7px 13px;

            border-radius: 20px;

            font-size: 0.75rem;

            font-weight: 700;

            white-space: nowrap;
        }


        .application-status::before {
            content: "";

            width: 7px;
            height: 7px;

            border-radius: 50%;
        }


        .status-applied {
            color: var(--warning);

            background:
                rgba(251, 191, 36, 0.08);

            border:
                1px solid rgba(251, 191, 36, 0.25);

            box-shadow:
                0 0 12px rgba(251, 191, 36, 0.08);
        }


        .status-applied::before {
            background: var(--warning);

            box-shadow:
                0 0 8px var(--warning);
        }


        .status-shortlisted {
            color: #4ade80;

            background:
                rgba(34, 197, 94, 0.08);

            border:
                1px solid rgba(34, 197, 94, 0.25);

            box-shadow:
                0 0 12px rgba(34, 197, 94, 0.08);
        }


        .status-shortlisted::before {
            background: var(--success);

            box-shadow:
                0 0 8px var(--success);
        }


        .status-rejected {
            color: #ff7b91;

            background:
                rgba(255, 77, 109, 0.08);

            border:
                1px solid rgba(255, 77, 109, 0.25);

            box-shadow:
                0 0 12px rgba(255, 77, 109, 0.08);
        }


        .status-rejected::before {
            background: var(--danger);

            box-shadow:
                0 0 8px var(--danger);
        }


        /* =====================================================
           DETAILS
           ===================================================== */

        .application-details {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 12px;

            margin-bottom: 20px;
        }


        .application-detail {
            padding: 13px 15px;

            background:
                rgba(5, 12, 26, 0.55);

            border:
                1px solid rgba(79, 124, 255, 0.12);

            border-radius: 10px;
        }


        .application-detail-label {
            margin-bottom: 5px;

            color: var(--text-muted);

            font-size: 0.72rem;

            font-weight: 600;

            text-transform: uppercase;

            letter-spacing: 0.4px;
        }


        .application-detail-value {
            color: #cbd5e1;

            font-size: 0.88rem;

            font-weight: 500;
        }


        /* =====================================================
           COVER LETTER
           ===================================================== */

        .cover-letter {
            padding-top: 18px;

            border-top:
                1px solid rgba(79, 124, 255, 0.14);
        }


        .cover-letter-title {
            margin-bottom: 8px;

            color: #e2e8f0;

            font-size: 0.85rem;

            font-weight: 700;
        }


        .cover-letter-text {
            color: var(--text-light);

            font-size: 0.85rem;

            line-height: 1.65;

            white-space: pre-wrap;

            word-break: break-word;
        }


        /* =====================================================
           EMPTY STATE
           ===================================================== */

        .applications-empty {
            padding: 60px 25px;

            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    rgba(17, 27, 49, 0.92),
                    rgba(8, 15, 30, 0.88)
                );

            border:
                1px dashed rgba(79, 124, 255, 0.3);

            border-radius: var(--radius);

            box-shadow: var(--shadow);
        }


        .applications-empty h3 {
            margin:
                0 0 10px;

            color: white;
        }


        .applications-empty p {
            margin:
                0 0 22px;

            color: var(--text-light);
        }


        .browse-jobs-btn {
            display: inline-flex;

            padding:
                11px 20px;

            border-radius: 10px;

            color: white;

            font-size: 0.88rem;

            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--cyan)
                );

            box-shadow:
                0 8px 25px rgba(0, 229, 255, 0.15);

            transition: 0.25s ease;
        }


        .browse-jobs-btn:hover {
            color: white;

            transform:
                translateY(-2px);

            box-shadow:
                0 10px 35px rgba(0, 229, 255, 0.3);

            text-shadow: none;
        }


        .applications-loading {
            text-align: center;

            padding: 50px;

            color: var(--text-light);
        }


        .applications-error {
            padding: 18px;

            border-radius: 12px;

            color: #ff7b91;

            background:
                rgba(239, 68, 68, 0.08);

            border:
                1px solid rgba(239, 68, 68, 0.25);

            text-align: center;
        }


        @media (max-width: 700px) {

            .application-header {
                flex-direction: column;
            }

            .application-details {
                grid-template-columns: 1fr;
            }

        }

    </style>
</head>


<body>

<div class="app-container">

    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <aside class="sidebar">

        <div class="sidebar-brand">
            Job Portal
        </div>


        <ul class="sidebar-menu">

            <li>
                <a href="dashboard.html">
                    Dashboard
                </a>
            </li>

            <li>
                <a href="profile.html">
                    Profile Settings
                </a>
            </li>

            <li>
                <a href="jobs.html">
                    Browse Jobs
                </a>
            </li>

            <li>
                <a href="candidate-applications.html"
                   class="active">
                    My Applications
                </a>
            </li>

            <li>
                <a href="#"
                   id="logoutBtn">
                    Logout
                </a>
            </li>

        </ul>

    </aside>


    <!-- =====================================================
         MAIN CONTENT
         ===================================================== -->

    <main class="main-content">

        <header class="header">

            <h1 class="page-title">
                My Applications
            </h1>

        </header>


        <!-- SUMMARY -->

        <div class="applications-summary">

            <div class="application-stat">

                <div
                    class="application-stat-number"
                    id="totalApplications">
                    0
                </div>

                <div class="application-stat-label">
                    Total Applications
                </div>

            </div>


            <div class="application-stat">

                <div
                    class="application-stat-number"
                    id="appliedCount">
                    0
                </div>

                <div class="application-stat-label">
                    Applied
                </div>

            </div>


            <div class="application-stat">

                <div
                    class="application-stat-number"
                    id="shortlistedCount">
                    0
                </div>

                <div class="application-stat-label">
                    Shortlisted
                </div>

            </div>


            <div class="application-stat">

                <div
                    class="application-stat-number"
                    id="rejectedCount">
                    0
                </div>

                <div class="application-stat-label">
                    Rejected
                </div>

            </div>

        </div>


        <!-- APPLICATIONS -->

        <div
            id="applicationsContainer"
            class="applications-list">

            <div class="applications-loading">
                Loading your applications...
            </div>

        </div>

    </main>

</div>


<script src="js/app.js"></script>


<script>

    document.addEventListener(
        'DOMContentLoaded',
        async () => {

            const user =
                await checkAuth();

            if (user) {

                loadApplications();

            }

        }
    );


    async function loadApplications() {

        const candidateId =
            localStorage.getItem('candidateId');


        if (!candidateId) {

            document.getElementById(
                'applicationsContainer'
            ).innerHTML = `

                <div class="applications-error">
                    Candidate information not found.
                    Please login again.
                </div>

            `;

            return;

        }


        try {

            const response =
                await fetch(
                    `/api/applications/candidate/${candidateId}`
                );


            if (!response.ok) {

                throw new Error(
                    'Unable to load applications.'
                );

            }


            const applications =
                await response.json();


            updateSummary(
                applications
            );


            displayApplications(
                applications
            );


        } catch (error) {

            console.error(
                'Application loading error:',
                error
            );


            document.getElementById(
                'applicationsContainer'
            ).innerHTML = `

                <div class="applications-error">
                    ${escapeHtml(error.message)}
                </div>

            `;

        }

    }


    function updateSummary(
        applications
    ) {

        let applied = 0;

        let shortlisted = 0;

        let rejected = 0;


        applications.forEach(
            application => {

                if (
                    application.status ===
                    'Applied'
                ) {

                    applied++;

                }

                else if (
                    application.status ===
                    'Shortlisted'
                ) {

                    shortlisted++;

                }

                else if (
                    application.status ===
                    'Rejected'
                ) {

                    rejected++;

                }

            }
        );


        document.getElementById(
            'totalApplications'
        ).textContent =
            applications.length;


        document.getElementById(
            'appliedCount'
        ).textContent =
            applied;


        document.getElementById(
            'shortlistedCount'
        ).textContent =
            shortlisted;


        document.getElementById(
            'rejectedCount'
        ).textContent =
            rejected;

    }


    function displayApplications(
        applications
    ) {

        const container =
            document.getElementById(
                'applicationsContainer'
            );


        if (
            !applications ||
            applications.length === 0
        ) {

            container.innerHTML = `

                <div class="applications-empty">

                    <h3>
                        No Applications Yet
                    </h3>

                    <p>
                        You haven't applied for any jobs yet.
                        Browse available jobs and start applying.
                    </p>

                    <a
                        href="jobs.html"
                        class="browse-jobs-btn">
                        Browse Jobs
                    </a>

                </div>

            `;

            return;

        }


        container.innerHTML =
            applications
                .map(
                    application =>
                        createApplicationCard(
                            application
                        )
                )
                .join('');

    }


    function createApplicationCard(
        application
    ) {

        const job =
            application.job || {};


        const status =
            application.status ||
            'Applied';


        let statusClass =
            'status-applied';


        if (
            status ===
            'Shortlisted'
        ) {

            statusClass =
                'status-shortlisted';

        }

        else if (
            status ===
            'Rejected'
        ) {

            statusClass =
                'status-rejected';

        }


        const coverLetter =
            application.coverLetter
                ? escapeHtml(
                    application.coverLetter
                )
                : 'No cover letter provided.';


        return `

            <div class="application-card">

                <div class="application-header">

                    <div>

                        <h2 class="application-job-title">

                            ${escapeHtml(
                                job.title ||
                                'Job Position'
                            )}

                        </h2>


                        <div class="application-company">

                            ${escapeHtml(
                                job.company ||
                                'Company'
                            )}

                        </div>

                    </div>


                    <span
                        class="application-status
                        ${statusClass}">

                        ${escapeHtml(status)}

                    </span>

                </div>


                <div class="application-details">


                    <div class="application-detail">

                        <div
                            class="application-detail-label">
                            Location
                        </div>

                        <div
                            class="application-detail-value">

                            ${escapeHtml(
                                job.location ||
                                'Not specified'
                            )}

                        </div>

                    </div>


                    <div class="application-detail">

                        <div
                            class="application-detail-label">
                            Employment Type
                        </div>

                        <div
                            class="application-detail-value">

                            ${escapeHtml(
                                job.employmentType ||
                                'Not specified'
                            )}

                        </div>

                    </div>


                    <div class="application-detail">

                        <div
                            class="application-detail-label">
                            Applied On
                        </div>

                        <div
                            class="application-detail-value">

                            ${formatDate(
                                application.appliedDate
                            )}

                        </div>

                    </div>


                    <div class="application-detail">

                        <div
                            class="application-detail-label">
                            Application ID
                        </div>

                        <div
                            class="application-detail-value">

                            #${application.id}

                        </div>

                    </div>

                </div>


                <div class="cover-letter">

                    <div class="cover-letter-title">
                        Cover Letter
                    </div>

                    <div class="cover-letter-text">

                        ${coverLetter}

                    </div>

                </div>

            </div>

        `;

    }


    function formatDate(
        dateString
    ) {

        if (!dateString) {

            return 'Not available';

        }


        const date =
            new Date(dateString);


        if (
            isNaN(
                date.getTime()
            )
        ) {

            return dateString;

        }


        return date.toLocaleDateString(
            'en-IN',
            {
                day: '2-digit',
                month: 'short',
                year: 'numeric'
            }
        );

    }


    function escapeHtml(
        value
    ) {

        if (
            value === null ||
            value === undefined
        ) {

            return '';

        }


        return String(value)
            .replace(
                /&/g,
                '&amp;'
            )
            .replace(
                /</g,
                '&lt;'
            )
            .replace(
                />/g,
                '&gt;'
            )
            .replace(
                /"/g,
                '&quot;'
            )
            .replace(
                /'/g,
                '&#039;'
            );

    }

</script>

</body>
</html>
