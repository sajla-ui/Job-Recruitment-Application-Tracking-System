<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Career X | Browse Jobs</title>
    

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="css/careerx.css">


    <style>

        /* =====================================================
           CAREER X LOGO
           ===================================================== */

        .careerx-logo {
            display: flex;

            align-items: center;

            gap: 16px;

            padding:
                8px 10px 28px;
        }


        .careerx-logo-icon {
            width: 54px;
            height: 54px;

            display: flex;

            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #22d3ee 0%,
                    #38bdf8 45%,
                    #6366f1 100%
                );

            color: #020617;

            font-size: 25px;

            font-weight: 950;

            box-shadow:
                0 0 25px
                rgba(34, 211, 238, 0.22),

                0 8px 25px
                rgba(37, 99, 235, 0.18);
        }


        .careerx-logo-text {
            color: #f8fafc;

            font-size: 1.8rem;

            font-weight: 900;

            letter-spacing: -0.045em;

            white-space: nowrap;
        }


        .careerx-logo-text span {
            color: #22d3ee;

            font-weight: 900;
        }


        /* =====================================================
           JOBS PAGE
           ===================================================== */

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            min-height: 100vh;

            font-family:
                'Inter',
                sans-serif;

            color: #f8fafc;

            background: #050914;

            overflow-x: hidden;
        }


        /* =====================================================
           BACKGROUND
           ===================================================== */

        .jobs-background {
            position: fixed;

            inset: 0;

            z-index: -1;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(0, 229, 255, 0.07),
                    transparent 28%
                ),

                radial-gradient(
                    circle at 85% 75%,
                    rgba(99, 102, 241, 0.09),
                    transparent 32%
                ),

                #050914;
        }


        .jobs-grid {
            position: absolute;

            inset: 0;

            opacity: 0.28;

            background-image:
                linear-gradient(
                    rgba(0, 229, 255, 0.045) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(0, 229, 255, 0.045) 1px,
                    transparent 1px
                );

            background-size: 55px 55px;

            mask-image:
                linear-gradient(
                    to bottom,
                    black,
                    transparent 90%
                );
        }


        .jobs-orb {
            position: absolute;

            border-radius: 50%;

            filter: blur(100px);

            opacity: 0.18;

            animation:
                jobsFloat
                10s
                ease-in-out
                infinite;
        }


        .jobs-orb-one {
            width: 320px;
            height: 320px;

            top: -140px;
            left: 180px;

            background: #00e5ff;
        }


        .jobs-orb-two {
            width: 350px;
            height: 350px;

            right: -160px;
            bottom: -140px;

            background: #7c3aed;

            animation-delay: -4s;
        }


        @keyframes jobsFloat {

            0%,
            100% {
                transform:
                    translateY(0);
            }

            50% {
                transform:
                    translateY(-25px);
            }

        }


        /* =====================================================
           APP LAYOUT
           ===================================================== */

        .app-container {
            display: flex;

            min-height: 100vh;
        }


        /* =====================================================
           SIDEBAR
           ===================================================== */

        .sidebar {
            position: fixed;

            top: 0;
            left: 0;
            bottom: 0;

            width: 255px;

            padding:
                28px 18px;

            background:
                linear-gradient(
                    180deg,
                    rgba(8, 17, 34, 0.97),
                    rgba(4, 10, 22, 0.97)
                );

            border-right:
                1px solid
                rgba(0, 229, 255, 0.10);

            box-shadow:
                15px 0 50px
                rgba(0, 0, 0, 0.20);

            backdrop-filter:
                blur(20px);

            z-index: 20;
        }


        /* =====================================================
           SIDEBAR MENU
           ===================================================== */

        .sidebar-menu {
            list-style: none;

            padding: 0;

            margin: 0;
        }


        .sidebar-menu li {
            margin-bottom: 6px;
        }


        .sidebar-menu a {
            position: relative;

            display: flex;

            align-items: center;

            gap: 12px;

            padding:
                12px 14px;

            border-radius: 11px;

            color: #94a3b8;

            text-decoration: none;

            font-size: 0.82rem;

            font-weight: 600;

            transition:
                0.25s ease;
        }


        .sidebar-menu a::before {
            content: "";

            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #334155;

            transition:
                0.25s ease;
        }


        .sidebar-menu a:hover {
            color: #e2e8f0;

            background:
                rgba(0, 229, 255, 0.05);

            transform:
                translateX(3px);
        }


        .sidebar-menu a:hover::before {
            background: #00e5ff;

            box-shadow:
                0 0 10px
                #00e5ff;
        }


        .sidebar-menu a.active {
            color: #67e8f9;

            background:
                linear-gradient(
                    90deg,
                    rgba(0, 229, 255, 0.10),
                    rgba(99, 102, 241, 0.06)
                );

            border:
                1px solid
                rgba(0, 229, 255, 0.10);

            box-shadow:
                inset 3px 0 0
                #00e5ff;
        }


        .sidebar-menu a.active::before {
            background: #00e5ff;

            box-shadow:
                0 0 10px
                #00e5ff;
        }


        /* =====================================================
           MAIN CONTENT
           ===================================================== */

        .main-content {
            width:
                calc(100% - 255px);

            margin-left: 255px;

            padding:
                35px 40px 50px;
        }


        /* =====================================================
           HEADER
           ===================================================== */

        .header {
            margin-bottom: 25px;

            padding-bottom: 22px;

            border-bottom:
                1px solid
                rgba(100, 116, 139, 0.12);
        }


        .page-title {
            margin: 0;

            color: #f8fafc;

            font-size:
                clamp(
                    1.5rem,
                    3vw,
                    2rem
                );

            font-weight: 800;

            letter-spacing: -0.7px;
        }


        /* =====================================================
           MAIN CONTENT CARD
           ===================================================== */

        .content-card {
            position: relative;

            padding: 26px;

            border-radius: 20px;

            background:
                linear-gradient(
                    145deg,
                    rgba(15, 27, 49, 0.94),
                    rgba(5, 12, 25, 0.95)
                );

            border:
                1px solid
                rgba(79, 124, 255, 0.14);

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.25);

            overflow: hidden;
        }


        .content-card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 3px;

            background:
                linear-gradient(
                    90deg,
                    #00e5ff,
                    #6366f1,
                    #a855f7
                );

            box-shadow:
                0 0 15px
                rgba(0, 229, 255, 0.25);
        }


        /* =====================================================
           SEARCH
           ===================================================== */

        #searchForm {
            display: grid !important;

            grid-template-columns:
                1fr 1fr auto;

            gap: 12px !important;

            margin-bottom: 25px !important;

            padding-bottom: 22px;

            border-bottom:
                1px solid
                rgba(100, 116, 139, 0.12);
        }


        .form-control {
            width: 100%;

            padding:
                13px 15px;

            border-radius: 11px;

            outline: none;

            color: #f8fafc;

            background:
                rgba(3, 10, 22, 0.75);

            border:
                1px solid
                rgba(100, 116, 139, 0.22);

            font-family: inherit;

            font-size: 0.85rem;

            transition:
                0.25s ease;
        }


        .form-control:focus {
            border-color:
                #00e5ff;

            box-shadow:
                0 0 0 3px
                rgba(0, 229, 255, 0.07),

                0 0 20px
                rgba(0, 229, 255, 0.07);
        }


        .form-control::placeholder {
            color: #475569;
        }


        .search-button {
            min-width: 105px;

            padding:
                12px 20px;

            border: none;

            border-radius: 10px;

            color: #04111c;

            background:
                linear-gradient(
                    135deg,
                    #00e5ff,
                    #6366f1
                );

            font-family: inherit;

            font-size: 0.82rem;

            font-weight: 800;

            cursor: pointer;

            transition:
                0.25s ease;
        }


        .search-button:hover {
            transform:
                translateY(-2px);

            box-shadow:
                0 10px 28px
                rgba(0, 229, 255, 0.22);
        }


        /* =====================================================
           JOB LIST
           ===================================================== */

        .job-list {
            display: flex;

            flex-direction: column;

            gap: 16px;
        }


        .job-card {
            position: relative;

            padding: 22px;

            border-radius: 16px;

            background:
                linear-gradient(
                    145deg,
                    rgba(17, 31, 55, 0.90),
                    rgba(6, 14, 29, 0.92)
                );

            border:
                1px solid
                rgba(79, 124, 255, 0.13);

            box-shadow:
                0 12px 35px
                rgba(0, 0, 0, 0.18);

            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease;

            overflow: hidden;
        }


        .job-card::before {
            content: "";

            position: absolute;

            left: 0;
            top: 0;

            width: 3px;
            height: 100%;

            background:
                linear-gradient(
                    180deg,
                    #00e5ff,
                    #6366f1,
                    #a855f7
                );

            opacity: 0.8;
        }


        .job-card:hover {
            transform:
                translateY(-4px);

            border-color:
                rgba(0, 229, 255, 0.25);

            box-shadow:
                0 18px 45px
                rgba(0, 229, 255, 0.06);
        }


        .job-header {
            display: flex;

            align-items: flex-start;

            justify-content: space-between;

            gap: 20px;

            margin-bottom: 15px;
        }


        .job-title {
            margin:
                0 0 7px;

            color: #67e8f9;

            font-size: 1.1rem;

            font-weight: 800;

            letter-spacing: -0.2px;
        }


        .job-company {
            color: #e2e8f0;

            font-size: 0.85rem;

            font-weight: 650;
        }


        /* =====================================================
           EMPLOYMENT BADGE
           ===================================================== */

        .badge {
            display: inline-flex;

            align-items: center;

            padding:
                6px 11px;

            border-radius: 20px;

            white-space: nowrap;

            font-size: 0.68rem;

            font-weight: 750;
        }


        .badge-primary {
            color: #67e8f9;

            background:
                rgba(0, 229, 255, 0.07);

            border:
                1px solid
                rgba(0, 229, 255, 0.20);
        }


        /* =====================================================
           JOB DETAILS
           ===================================================== */

        .job-details {
            display: flex;

            flex-wrap: wrap;

            gap: 16px;

            padding-bottom: 15px;

            border-bottom:
                1px solid
                rgba(100, 116, 139, 0.10);

            color: #94a3b8;

            font-size: 0.75rem;

            font-weight: 550;
        }


        .job-details span {
            display: inline-flex;

            align-items: center;

            gap: 5px;
        }


        /* =====================================================
           DESCRIPTION
           ===================================================== */

        .job-description {
            margin:
                16px 0 0;

            color: #cbd5e1;

            font-size: 0.83rem;

            line-height: 1.7;

            white-space: pre-wrap;
        }


        /* =====================================================
           REQUIREMENTS
           ===================================================== */

        .job-requirements {
            margin:
                13px 0 0;

            padding:
                13px 15px;

            border-radius: 10px;

            color: #94a3b8;

            background:
                rgba(3, 10, 22, 0.45);

            border:
                1px solid
                rgba(79, 124, 255, 0.10);

            font-size: 0.78rem;

            line-height: 1.6;
        }


        .job-requirements strong {
            color: #cbd5e1;
        }


        /* =====================================================
           APPLY BUTTON
           ===================================================== */

        .job-actions {
            display: flex;

            justify-content: flex-end;

            margin-top: 18px;
        }


        .apply-button {
            padding:
                10px 18px;

            border: none;

            border-radius: 9px;

            color: #04111c;

            background:
                linear-gradient(
                    135deg,
                    #00e5ff,
                    #6366f1
                );

            font-family: inherit;

            font-size: 0.76rem;

            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 7px 20px
                rgba(0, 229, 255, 0.10);

            transition:
                0.25s ease;
        }


        .apply-button:hover {
            transform:
                translateY(-2px);

            box-shadow:
                0 10px 28px
                rgba(0, 229, 255, 0.22);
        }


        /* =====================================================
           EMPTY / ERROR
           ===================================================== */

        .empty-state {
            padding:
                45px 25px;

            border-radius: 14px;

            color: #94a3b8;

            background:
                rgba(3, 10, 22, 0.45);

            border:
                1px dashed
                rgba(0, 229, 255, 0.15);

            text-align: center;

            font-size: 0.85rem;
        }


        .alert {
            padding: 15px;

            border-radius: 11px;

            font-size: 0.82rem;
        }


        .alert-error {
            color: #fca5a5;

            background:
                rgba(239, 68, 68, 0.08);

            border:
                1px solid
                rgba(239, 68, 68, 0.25);

            text-align: center;
        }


        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (max-width: 800px) {

            .sidebar {
                position: relative;

                width: 100%;

                min-height: auto;

                padding: 18px;

                border-right: none;

                border-bottom:
                    1px solid
                    rgba(0, 229, 255, 0.10);
            }


            .app-container {
                display: block;
            }


            .careerx-logo {
                padding:
                    8px 8px 18px;
            }


            .sidebar-menu {
                display: flex;

                flex-wrap: wrap;

                gap: 6px;
            }


            .sidebar-menu li {
                margin: 0;
            }


            .sidebar-menu a {
                padding:
                    9px 11px;
            }


            .main-content {
                width: 100%;

                margin-left: 0;

                padding:
                    25px 20px 40px;
            }


            #searchForm {
                grid-template-columns:
                    1fr !important;
            }


            .search-button {
                width: 100%;
            }

        }


        @media (max-width: 600px) {

            .content-card {
                padding: 18px;
            }


            .job-header {
                flex-direction: column;
            }


            .job-actions {
                justify-content: stretch;
            }


            .apply-button {
                width: 100%;
            }

        }

    </style>

</head>

    <!-- =====================================================

    <div class="app-container">


        <!-- =================================================

            <div class="careerx-logo">

                <div class="careerx-logo-icon">

                <div class="careerx-logo-text">

                </div>

            </div>


            <ul class="sidebar-menu">


                <li>

                </li>


                <li>

                    </a>

                </li>


                <li>

                    <a
                        href="jobs.html"
                        class="active">

                    </a>

                </li>


                <li>

                    <a href="candidate-applications.html">

                    </a>

                </li>

                    </a>

            </ul>

        </aside>


        <!-- =================================================
             MAIN CONTENT
             ================================================= -->

        <main class="main-content">


            <header class="header">

                <h1 class="page-title">

                    Available Jobs

                </h1>

            </header>


            <!-- =================================================
                 JOB CONTENT
                 ================================================= -->

            <div class="content-card">


                <!-- SEARCH -->

                <form id="searchForm">

                    <input
                        type="text"
                        id="keyword"
                        class="form-control"
                        placeholder="Job title or keyword"

                    </div>

                </div>

            </div>

    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="js/app.js"></script>


    <script>

        document.addEventListener(
            'DOMContentLoaded',
            async () => {

                await checkAuth();

                loadJobs();


                document
                    .getElementById('searchForm')
                    .addEventListener(
                        'submit',
                        function(e) {

                            e.preventDefault();


                            const keyword =
                                document
                                    .getElementById('keyword')
                                    .value
                                    .trim();


                            const location =
                                document
                                    .getElementById('location')
                                    .value
                                    .trim();


                            loadJobs(
                                keyword,
                                location
                            );

                        }
                    );

            }
        );


        /* =====================================================
           LOAD JOBS
           ===================================================== */

        async function loadJobs(
            keyword = '',
            location = ''
        ) {

            const listDiv =
                document.getElementById(
                    'jobList'
                );


            try {

                let url =
                    '/api/recruiter/jobs';


                /*
                 * Use the SEARCH endpoint when searching.
                 */

                if (
                    keyword ||
                    location
                ) {

                    url =
                        '/api/recruiter/jobs/search'
                        + '?keyword='
                        + encodeURIComponent(keyword)
                        + '&location='
                        + encodeURIComponent(location);

                }


                console.log(
                    'Loading jobs from:',
                    url
                );


                const response =
                    await fetch(url);


                console.log(
                    'Jobs response status:',
                    response.status
                );


                if (!response.ok) {

                    const errorText =
                        await response.text();


                    console.error(
                        'Jobs API error:',
                        errorText
                    );


                    listDiv.innerHTML =
                        `
                            <div class="alert alert-error">

                                Failed to load jobs.

                            </div>
                        `;

                    return;

                }


                const jobs =
                    await response.json();


                console.log(
                    'Jobs received:',
                    jobs
                );


                if (
                    !Array.isArray(jobs) ||
                    jobs.length === 0
                ) {

                    listDiv.innerHTML =
                        `
                            <div class="empty-state">

                                No jobs found matching your criteria.

                            </div>
                        `;

                    return;

                }


                listDiv.innerHTML =
                    jobs
                        .map(
                            job => `

                                <div class="job-card">


                                    <div class="job-header">


                                        <div>

                                            <h3 class="job-title">

                                                ${escapeHtml(
                                                    job.title ||
                                                    'Untitled Job'
                                                )}

                                            </h3>


                                            <div class="job-company">

                                                ${escapeHtml(
                                                    job.company ||
                                                    'Company not specified'
                                                )}

                                            </div>

                                        </div>


                                        <span class="badge badge-primary">

                                            ${escapeHtml(
                                                job.employmentType ||
                                                'Full-time'
                                            )}

                                        </span>


                                    </div>


                                    <div class="job-details">


                                        <span>

                                            &#128205;

                                            ${escapeHtml(
                                                job.location ||
                                                'Location not specified'
                                            )}

                                        </span>


                                        <span>

                                            &#128197;

                                            ${
                                                job.postedDate
                                                ? new Date(
                                                    job.postedDate
                                                ).toLocaleDateString()
                                                : 'Recently'
                                            }

                                        </span>


                                    </div>


                                    <p class="job-description">

                                        ${escapeHtml(
                                            job.description ||
                                            ''
                                        )}

                                    </p>


                                    <div class="job-requirements">

                                        <strong>
                                            Requirements:
                                        </strong>

                                        ${escapeHtml(
                                            job.requirements ||
                                            'Not specified'
                                        )}

                                    </div>


                                    <div class="job-actions">

                                        <button
                                            class="apply-button"
                                            onclick="applyForJob(${job.id})">

                                            Apply Now

                                        </button>

                                    </div>


                                </div>

                            `
                        )
                        .join('');


            }

            catch (error) {

                console.error(
                    'Load jobs error:',
                    error
                );


                listDiv.innerHTML =
                    `
                        <div class="alert alert-error">

                            Failed to connect to the server.

                        </div>
                    `;

            }

        }


        /* =====================================================
           APPLY FOR JOB
           ===================================================== */

        async function applyForJob(
            jobId
        ) {

            const candidateId =
                localStorage.getItem(
                    'candidateId'
                );


            if (!candidateId) {

                alert(
                    'Please login first.'
                );


                window.location.href =
                    'index.html';


                return;

            }


            const coverLetter =
                prompt(
                    'Enter your cover letter:'
                );


            if (
                coverLetter === null
            ) {

                return;

            }


            try {

                const params =
                    new URLSearchParams();


                params.append(
                    'candidateId',
                    candidateId
                );


                params.append(
                    'jobId',
                    jobId
                );


                params.append(
                    'coverLetter',
                    coverLetter
                );


                console.log(
                    'Submitting application:',
                    {
                        candidateId:
                            candidateId,

                        jobId:
                            jobId
                    }
                );


                const response =
                    await fetch(
                        '/api/applications',
                        {
                            method: 'POST',

                            headers: {
                                'Content-Type':
                                    'application/x-www-form-urlencoded'
                            },

                            body:
                                params.toString()
                        }
                    );


                const responseText =
                    await response.text();


                console.log(
                    'Application response:',
                    response.status,
                    responseText
                );


                if (
                    response.ok
                ) {

                    alert(
                        'Application submitted successfully!'
                    );

                }

                else {

                    let message =
                        'Failed to submit application.';


                    try {

                        const data =
                            JSON.parse(
                                responseText
                            );


                        if (
                            data.message
                        ) {

                            message =
                                data.message;

                        }

                    }

                    catch (e) {

                        console.error(
                            'Could not parse error:',
                            e
                        );

                    }


                    alert(message);

                }


            }

            catch (error) {

                console.error(
                    'Application error:',
                    error
                );


                alert(
                    'Could not connect to the server.'
                );

            }

        }


        /* =====================================================
           HTML ESCAPING
           ===================================================== */

        function escapeHtml(
            value
        ) {

            if (
                value === null ||
                value === undefined
            ) {

                return '';

            }


            return String(value)

                .replace(
                    /&/g,
                    '&amp;'
                )

                .replace(
                    /</g,
                    '&lt;'
                )

                .replace(
                    />/g,
                    '&gt;'
                )

                .replace(
                    /"/g,
                    '&quot;'
                )

                .replace(
                    /'/g,
                    '&#039;'
                );

        }

    </script>
