<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .profile-nav {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }
        .profile-nav a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 5px;
        }
        .profile-nav a.active {
            background-color: rgba(67, 97, 238, 0.1);
            color: var(--primary-color);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">Job Portal</div>
            <ul class="sidebar-menu">
    <li><a href="dashboard.html">Dashboard</a></li>
    <li><a href="profile.html" class="active">Profile Settings</a></li>
    <li><a href="jobs.html">Browse Jobs</a></li>
    <li><a href="candidate-applications.html">My Applications</a></li>
    <li><a href="#" id="logoutBtn">Logout</a></li>
</ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <h1 class="page-title">Profile Settings</h1>
            </header>
            
            <div id="alertMessage" class="alert"></div>

            <div class="profile-nav">
                <a href="profile.html" class="active">Basic Info</a>
                <a href="skills.html">Skills</a>
                <a href="education.html">Education</a>
                <a href="experience.html">Experience</a>
                <a href="resume.html">Resume</a>
            </div>

            <div class="content-card">
                <form id="profileForm">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Email (Cannot be changed)</label>
                        <input type="email" id="email" class="form-control" disabled style="background-color: #f1f3f5;">
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="text" id="phone" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="location">Location</label>
                        <input type="text" id="location" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="summary">Profile Summary</label>
                        <textarea id="summary" class="form-control" rows="4" placeholder="Write a short professional summary about yourself..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" id="saveBtn">Save Changes</button>
                </form>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script>
        let currentUser = null;
        
        document.addEventListener('DOMContentLoaded', async () => {
            currentUser = await checkAuth();
            if (currentUser) {
                document.getElementById('name').value = currentUser.name || '';
                document.getElementById('email').value = currentUser.email || '';
                document.getElementById('phone').value = currentUser.phone || '';
                document.getElementById('location').value = currentUser.location || '';
                document.getElementById('summary').value = currentUser.profileSummary || '';
            }
        });

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.textContent = 'Saving...';
            btn.disabled = true;

            const updatedData = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                location: document.getElementById('location').value,
                profileSummary: document.getElementById('summary').value
            };

            try {
                const response = await fetch(`/api/candidates/${currentUser.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatedData)
                });

                if (response.ok) {
                    showAlert('Profile updated successfully!', 'success');
                    currentUser = await response.json();
                    localStorage.setItem('candidateName', currentUser.name);
                    updateUIForUser(currentUser);
                } else {
                    const err = await response.json();
                    showAlert(err.message || 'Update failed');
                }
            } catch (error) {
                showAlert('Error updating profile');
            } finally {
                btn.textContent = 'Save Changes';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
