<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Company Registration - Job Portal</title>

    <link rel="stylesheet" href="css/recruiter.css"></head>

<body>

<div class="recruiter-container">

    <div class="recruiter-card">

        <h1>Company Registration</h1>
        <p class="subtitle">Create your company account</p>

        <div id="message"></div>

        <form id="companyRegisterForm">

            <div class="form-group">
                <label for="companyName">Company Name</label>
                <input
                    type="text"
                    id="companyName"
                    placeholder="Enter company name"
                    required>
            </div>

            <div class="form-group">
                <label for="companyDescription">Company Description</label>
                <textarea
                    id="companyDescription"
                    placeholder="Describe your company"
                    rows="4"></textarea>
            </div>

            <div class="form-group">
                <label for="website">Website</label>
                <input
                    type="text"
                    id="website"
                    placeholder="https://example.com">
            </div>

            <div class="form-group">
                <label for="companyLocation">Company Location</label>
                <input
                    type="text"
                    id="companyLocation"
                    placeholder="Enter company location">
            </div>

            <div class="form-group">
                <label for="contactPerson">Contact Person</label>
                <input
                    type="text"
                    id="contactPerson"
                    placeholder="Enter contact person's name">
            </div>

            <div class="form-group">
                <label for="phone">Phone</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter phone number">
            </div>

            <div class="form-group">
                <label for="email">Company Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter company email"
                    required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required>
            </div>

            <button type="submit" id="registerBtn">
                Register Company
            </button>

        </form>

        <p class="bottom-text">
            Already have a company account?
            <a href="recruiter-login.html">Login here</a>
        </p>

        <p class="bottom-text">
            <a href="index.html">← Back to Home</a>
        </p>

    </div>

</div>

<script src="js/recruiter.js"></script>
</body>
</html>
