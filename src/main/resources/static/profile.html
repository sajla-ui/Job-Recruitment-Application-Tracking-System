<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Career X | Profile Settings</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="css/careerx.css">

    <style>

        /* =====================================================
           CAREER X LOGO
           ===================================================== */

        .careerx-logo {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 8px 10px 28px;
        }

        .careerx-logo-icon {
            width: 54px;
            height: 54px;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #22d3ee 0%,
                    #38bdf8 45%,
                    #6366f1 100%
                );

            color: #020617;

            font-size: 25px;
            font-weight: 950;

            box-shadow:
                0 0 25px rgba(34, 211, 238, 0.22),
                0 8px 25px rgba(37, 99, 235, 0.18);
        }

        .careerx-logo-text {
            color: #f8fafc;

            font-size: 1.8rem;
            font-weight: 900;

            letter-spacing: -0.045em;

            white-space: nowrap;
        }

        .careerx-logo-text span {
            color: #22d3ee;
            font-weight: 900;
        }


        /* =====================================================
           PROFILE PAGE
           ===================================================== */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            font-family:
                'Inter',
                sans-serif;

            color: #f8fafc;

            background: #050914;

            overflow-x: hidden;
        }


        /* =====================================================
           BACKGROUND
           ===================================================== */

        .profile-background {
            position: fixed;

            inset: 0;

            z-index: -1;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(0, 229, 255, 0.07),
                    transparent 28%
                ),

                radial-gradient(
                    circle at 85% 75%,
                    rgba(99, 102, 241, 0.09),
                    transparent 32%
                ),

                #050914;
        }

        .profile-grid {
            position: absolute;

            inset: 0;

            opacity: 0.28;

            background-image:
                linear-gradient(
                    rgba(0, 229, 255, 0.045) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(0, 229, 255, 0.045) 1px,
                    transparent 1px
                );

            background-size: 55px 55px;

            mask-image:
                linear-gradient(
                    to bottom,
                    black,
                    transparent 90%
                );
        }

        .profile-orb {
            position: absolute;

            border-radius: 50%;

            filter: blur(100px);

            opacity: 0.18;

            animation:
                profileFloat
                10s
                ease-in-out
                infinite;
        }

        .profile-orb-one {
            width: 320px;
            height: 320px;

            top: -140px;
            left: 180px;

            background: #00e5ff;
        }

        .profile-orb-two {
            width: 350px;
            height: 350px;

            right: -160px;
            bottom: -140px;

            background: #7c3aed;

            animation-delay: -4s;
        }

        @keyframes profileFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-25px);
            }

        }


        /* =====================================================
           APP LAYOUT
           ===================================================== */

        .app-container {
            display: flex;

            min-height: 100vh;
        }


        /* =====================================================
           SIDEBAR
           ===================================================== */

        .sidebar {
            position: fixed;

            top: 0;
            left: 0;
            bottom: 0;

            width: 255px;

            padding: 28px 18px;

            background:
                linear-gradient(
                    180deg,
                    rgba(8, 17, 34, 0.97),
                    rgba(4, 10, 22, 0.97)
                );

            border-right:
                1px solid
                rgba(0, 229, 255, 0.10);

            box-shadow:
                15px 0 50px
                rgba(0, 0, 0, 0.20);

            backdrop-filter: blur(20px);

            z-index: 20;
        }


        /* =====================================================
           SIDEBAR MENU
           ===================================================== */

        .sidebar-menu {
            list-style: none;

            padding: 0;

            margin: 0;
        }

        .sidebar-menu li {
            margin-bottom: 6px;
        }

        .sidebar-menu a {
            position: relative;

            display: flex;

            align-items: center;

            gap: 12px;

            padding: 12px 14px;

            border-radius: 11px;

            color: #94a3b8;

            text-decoration: none;

            font-size: 0.82rem;

            font-weight: 600;

            transition: 0.25s ease;
        }

        .sidebar-menu a::before {
            content: "";

            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #334155;

            transition: 0.25s ease;
        }

        .sidebar-menu a:hover {
            color: #e2e8f0;

            background:
                rgba(0, 229, 255, 0.05);

            transform:
                translateX(3px);
        }

        .sidebar-menu a:hover::before {
            background: #00e5ff;

            box-shadow:
                0 0 10px
                #00e5ff;
        }

        .sidebar-menu a.active {
            color: #67e8f9;

            background:
                linear-gradient(
                    90deg,
                    rgba(0, 229, 255, 0.10),
                    rgba(99, 102, 241, 0.06)
                );

            border:
                1px solid
                rgba(0, 229, 255, 0.10);

            box-shadow:
                inset 3px 0 0
                #00e5ff;
        }

        .sidebar-menu a.active::before {
            background: #00e5ff;

            box-shadow:
                0 0 10px
                #00e5ff;
        }


        /* =====================================================
           MAIN CONTENT
           ===================================================== */

        .main-content {
            width:
                calc(100% - 255px);

            margin-left: 255px;

            padding:
                35px 40px 50px;
        }


        /* =====================================================
           HEADER
           ===================================================== */

        .header {
            margin-bottom: 25px;

            padding-bottom: 22px;

            border-bottom:
                1px solid
                rgba(100, 116, 139, 0.12);
        }

        .page-title {
            margin: 0;

            color: #f8fafc;

            font-size:
                clamp(
                    1.5rem,
                    3vw,
                    2rem
                );

            font-weight: 800;

            letter-spacing: -0.7px;
        }


        /* =====================================================
           PROFILE NAVIGATION
           ===================================================== */

        .profile-nav {
            display: flex;

            flex-wrap: wrap;

            gap: 7px;

            margin-bottom: 25px;

            padding: 7px;

            border-radius: 14px;

            background:
                rgba(8, 17, 34, 0.72);

            border:
                1px solid
                rgba(79, 124, 255, 0.12);

            box-shadow:
                0 12px 35px
                rgba(0, 0, 0, 0.15);
        }

        .profile-nav a {
            position: relative;

            padding: 10px 16px;

            border-radius: 9px;

            color: #94a3b8;

            text-decoration: none;

            font-size: 0.78rem;

            font-weight: 650;

            transition: 0.25s ease;
        }

        .profile-nav a:hover {
            color: #e2e8f0;

            background:
                rgba(0, 229, 255, 0.05);
        }

        .profile-nav a.active {
            color: #04111c;

            background:
                linear-gradient(
                    135deg,
                    #00e5ff,
                    #6366f1
                );

            box-shadow:
                0 6px 20px
                rgba(0, 229, 255, 0.15);
        }


        /* =====================================================
           ALERT
           ===================================================== */

        #alertMessage {
            display: none;

            width: 100%;

            margin-bottom: 20px;

            padding: 13px 16px;

            border-radius: 11px;

            font-size: 0.83rem;

            font-weight: 600;
        }


        /* =====================================================
           CONTENT CARD
           ===================================================== */

        .content-card {
            position: relative;

            width: 100%;

            max-width: none;

            padding: 32px;

            border-radius: 20px;

            background:
                linear-gradient(
                    145deg,
                    rgba(15, 27, 49, 0.94),
                    rgba(5, 12, 25, 0.95)
                );

            border:
                1px solid
                rgba(79, 124, 255, 0.14);

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.25);

            overflow: hidden;
        }

        .content-card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 3px;

            background:
                linear-gradient(
                    90deg,
                    #00e5ff,
                    #6366f1,
                    #a855f7
                );

            box-shadow:
                0 0 15px
                rgba(0, 229, 255, 0.25);
        }


        /* =====================================================
           FORM
           ===================================================== */

        #profileForm {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            column-gap: 24px;

            row-gap: 2px;

            width: 100%;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group:nth-child(5) {
            grid-column:
                1 / -1;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            color: #cbd5e1;

            font-size: 0.78rem;

            font-weight: 650;
        }

        .form-control {
            width: 100%;

            padding:
                13px 15px;

            border-radius: 11px;

            outline: none;

            color: #f8fafc;

            background:
                rgba(3, 10, 22, 0.75);

            border:
                1px solid
                rgba(100, 116, 139, 0.22);

            font-family: inherit;

            font-size: 0.87rem;

            transition: 0.25s ease;
        }

        .form-control:focus {
            border-color:
                #00e5ff;

            box-shadow:
                0 0 0 3px
                rgba(0, 229, 255, 0.07),

                0 0 20px
                rgba(0, 229, 255, 0.07);
        }

        .form-control:disabled {
            color: #64748b;

            background:
                rgba(15, 23, 42, 0.75);

            cursor: not-allowed;
        }

        textarea.form-control {
            resize: vertical;

            min-height: 130px;

            line-height: 1.6;
        }

        .form-control::placeholder {
            color: #475569;
        }


        /* =====================================================
           SAVE BUTTON
           ===================================================== */

        #saveBtn {
            grid-column:
                1 / -1;

            width: fit-content;

            margin-top: 8px;

            padding:
                12px 24px;

            border: none;

            border-radius: 10px;

            color: #04111c;

            background:
                linear-gradient(
                    135deg,
                    #00e5ff,
                    #6366f1
                );

            font-family: inherit;

            font-size: 0.82rem;

            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 8px 25px
                rgba(0, 229, 255, 0.13);

            transition: 0.25s ease;
        }

        #saveBtn:hover {
            transform:
                translateY(-2px);

            box-shadow:
                0 12px 32px
                rgba(0, 229, 255, 0.24);
        }

        #saveBtn:disabled {
            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }


        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (max-width: 800px) {

            .sidebar {
                position: relative;

                width: 100%;

                min-height: auto;

                padding: 18px;

                border-right: none;

                border-bottom:
                    1px solid
                    rgba(0, 229, 255, 0.10);
            }

            .app-container {
                display: block;
            }

            .careerx-logo {
                padding:
                    8px 8px 18px;
            }

            .sidebar-menu {
                display: flex;

                flex-wrap: wrap;

                gap: 6px;
            }

            .sidebar-menu li {
                margin: 0;
            }

            .sidebar-menu a {
                padding:
                    9px 11px;
            }

            .main-content {
                width: 100%;

                margin-left: 0;

                padding:
                    25px 20px 40px;
            }

            #profileForm {
                grid-template-columns:
                    1fr;
            }

            .form-group:nth-child(5) {
                grid-column: auto;
            }

        }


        @media (max-width: 600px) {

            .profile-nav {
                flex-direction: column;
            }

            .profile-nav a {
                text-align: center;
            }

            .content-card {
                padding:
                    24px 20px;
            }

            #saveBtn {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         BACKGROUND
         ===================================================== -->

    <div class="profile-background">

        <div class="profile-grid"></div>

        <div class="profile-orb profile-orb-one"></div>

        <div class="profile-orb profile-orb-two"></div>

    </div>


    <!-- =====================================================
         APPLICATION
         ===================================================== -->

    <div class="app-container">


        <!-- =================================================
             SIDEBAR
             ================================================= -->

        <aside class="sidebar">


            <!-- CAREER X LOGO -->

            <div class="careerx-logo">

                <div class="careerx-logo-icon">
                    X
                </div>

                <div class="careerx-logo-text">
                    Career <span>X</span>
                </div>

            </div>


            <ul class="sidebar-menu">


                <li>

                    <a href="dashboard.html">
                        Dashboard
                    </a>

                </li>


                <li>

                    <a
                        href="profile.html"
                        class="active">

                        Profile Settings

                    </a>

                </li>


                <li>

                    <a href="jobs.html">
                        Browse Jobs
                    </a>

                </li>


                <li>

                    <a href="candidate-applications.html">
                        My Applications
                    </a>

                </li>


                <li>

                    <a href="candidate-interviews.html">
                        My Interviews
                    </a>

                </li>


                <li>

                    <a
                        href="#"
                        id="logoutBtn">

                        Logout

                    </a>

                </li>

            </ul>

        </aside>


        <!-- =================================================
             MAIN CONTENT
             ================================================= -->

        <main class="main-content">


            <header class="header">

                <h1 class="page-title">
                    Profile Settings
                </h1>

            </header>


            <!-- =================================================
                 PROFILE NAVIGATION
                 ================================================= -->

            <nav class="profile-nav">

                <a
                    href="profile.html"
                    class="active">

                    Basic Info

                </a>

                <a href="skills.html">
                    Skills
                </a>

                <a href="education.html">
                    Education
                </a>

                <a href="experience.html">
                    Experience
                </a>

                <a href="resume.html">
                    Resume
                </a>

            </nav>


            <!-- =================================================
                 ALERT
                 ================================================= -->

            <div id="alertMessage"></div>


            <!-- =================================================
                 PROFILE FORM
                 ================================================= -->

            <div class="content-card">


                <form id="profileForm">


                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            class="form-control"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">

                            Email

                            <span style="color:#64748b;">
                                (Cannot be changed)
                            </span>

                        </label>

                        <input
                            type="email"
                            id="email"
                            class="form-control"
                            disabled
                        >

                    </div>


                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="text"
                            id="phone"
                            class="form-control"
                            placeholder="Enter your phone number"
                        >

                    </div>


                    <div class="form-group">

                        <label for="location">
                            Location
                        </label>

                        <input
                            type="text"
                            id="location"
                            class="form-control"
                            placeholder="City, State"
                        >

                    </div>


                    <div class="form-group">

                        <label for="summary">
                            Profile Summary
                        </label>

                        <textarea
                            id="summary"
                            class="form-control"
                            rows="5"
                            placeholder="Write a short professional summary about yourself..."
                        ></textarea>

                    </div>


                    <button
                        type="submit"
                        id="saveBtn">

                        Save Changes

                    </button>

                </form>

            </div>

        </main>

    </div>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="js/app.js"></script>


    <script>

        let currentUser = null;


        document.addEventListener(
            'DOMContentLoaded',
            async () => {

                currentUser =
                    await checkAuth();


                if (currentUser) {

                    document
                        .getElementById('name')
                        .value =
                            currentUser.name || '';


                    document
                        .getElementById('email')
                        .value =
                            currentUser.email || '';


                    document
                        .getElementById('phone')
                        .value =
                            currentUser.phone || '';


                    document
                        .getElementById('location')
                        .value =
                            currentUser.location || '';


                    document
                        .getElementById('summary')
                        .value =
                            currentUser.profileSummary || '';

                }

            }
        );


        document
            .getElementById('profileForm')
            .addEventListener(
                'submit',
                async (e) => {

                    e.preventDefault();


                    const btn =
                        document.getElementById(
                            'saveBtn'
                        );


                    btn.textContent =
                        'Saving...';

                    btn.disabled =
                        true;


                    const updatedData = {

                        name:
                            document
                                .getElementById('name')
                                .value,

                        phone:
                            document
                                .getElementById('phone')
                                .value,

                        location:
                            document
                                .getElementById('location')
                                .value,

                        profileSummary:
                            document
                                .getElementById('summary')
                                .value

                    };


                    try {

                        const response =
                            await fetch(
                                `/api/candidates/${currentUser.id}`,
                                {
                                    method: 'PUT',

                                    headers: {
                                        'Content-Type':
                                            'application/json'
                                    },

                                    body:
                                        JSON.stringify(
                                            updatedData
                                        )
                                }
                            );


                        if (response.ok) {

                            showAlert(
                                'Profile updated successfully!',
                                'success'
                            );


                            currentUser =
                                await response.json();


                            localStorage.setItem(
                                'candidateName',
                                currentUser.name
                            );


                            updateUIForUser(
                                currentUser
                            );

                        }

                        else {

                            const err =
                                await response.json();


                            showAlert(
                                err.message ||
                                'Update failed'
                            );

                        }

                    }

                    catch (error) {

                        showAlert(
                            'Error updating profile'
                        );

                    }

                    finally {

                        btn.textContent =
                            'Save Changes';

                        btn.disabled =
                            false;

                    }

                }
            );

    </script>


</body>

</html>
