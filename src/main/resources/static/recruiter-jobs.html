<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Jobs - Job Portal</title>

    <link rel="stylesheet" href="css/recruiter.css">

    <style>
        /* =====================================================
           RECRUITER JOBS PAGE
           ===================================================== */

        .jobs-page {
            min-height: 100vh;
            padding: 35px;
        }

        /* ================= HEADER ================= */

        .jobs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(56, 189, 248, 0.22);
        }

        .jobs-header h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(
                90deg,
                #38bdf8,
                #22d3ee,
                #8b5cf6
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .jobs-header p {
            margin: 8px 0 0;
            color: #94a3b8;
            font-size: 0.95rem;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tech-btn {
            padding: 11px 18px;
            border: 1px solid rgba(56, 189, 248, 0.35);
            border-radius: 10px;
            background: rgba(14, 165, 233, 0.10);
            color: #22d3ee;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: 0.25s ease;
        }

        .tech-btn:hover {
            transform: translateY(-2px);
            background: rgba(34, 211, 238, 0.16);
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.18);
        }

        /* ================= SEARCH ================= */

        .search-panel {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            padding: 18px;
            border-radius: 16px;
            background: rgba(14, 29, 52, 0.75);
            border: 1px solid rgba(56, 189, 248, 0.18);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.20);
        }

        .search-box {
            flex: 1;
            padding: 13px 15px;
            border: 1px solid rgba(148, 163, 184, 0.22);
            border-radius: 10px;
            background: rgba(5, 15, 30, 0.75);
            color: #f1f5f9;
            font-family: inherit;
            font-size: 0.94rem;
            outline: none;
            transition: 0.25s ease;
        }

        .search-box::placeholder {
            color: #64748b;
        }

        .search-box:focus {
            border-color: #22d3ee;
            box-shadow:
                0 0 0 3px rgba(34, 211, 238, 0.10),
                0 0 20px rgba(34, 211, 238, 0.08);
        }

        /* ================= COUNT ================= */

        .job-count {
            margin-bottom: 20px;
            color: #94a3b8;
            font-size: 0.95rem;
        }

        .job-count strong {
            color: #22d3ee;
        }

        /* ================= JOB GRID ================= */

        .jobs-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(320px, 1fr));
            gap: 22px;
        }

        /* ================= JOB CARD ================= */

        .job-card {
            position: relative;
            padding: 25px;
            border-radius: 18px;
            background: rgba(14, 29, 52, 0.88);
            border: 1px solid rgba(56, 189, 248, 0.20);
            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.30);
            overflow: hidden;
            transition: 0.3s ease;
        }

        .job-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(
                90deg,
                #38bdf8,
                #22d3ee,
                #8b5cf6
            );
        }

        .job-card:hover {
            transform: translateY(-5px);
            border-color: rgba(34, 211, 238, 0.45);
            box-shadow:
                0 20px 45px rgba(0, 0, 0, 0.40),
                0 0 25px rgba(14, 165, 233, 0.10);
        }

        /* ================= JOB TOP ================= */

        .job-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }

        .job-title {
            margin: 0 0 7px;
            color: #38bdf8;
            font-size: 1.25rem;
            font-weight: 750;
        }

        .job-company {
            color: #cbd5e1;
            font-weight: 600;
        }

        .job-badge {
            padding: 6px 10px;
            border-radius: 20px;
            color: #67e8f9;
            background: rgba(34, 211, 238, 0.10);
            border: 1px solid rgba(34, 211, 238, 0.25);
            font-size: 0.75rem;
            font-weight: 700;
            white-space: nowrap;
        }

        /* ================= JOB INFO ================= */

        .job-info {
            margin: 18px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .job-info span {
            padding: 6px 9px;
            border-radius: 8px;
            color: #94a3b8;
            background: rgba(5, 15, 30, 0.60);
            border: 1px solid rgba(148, 163, 184, 0.10);
            font-size: 0.82rem;
        }

        /* ================= DESCRIPTION ================= */

        .job-description {
            color: #cbd5e1;
            line-height: 1.6;
            font-size: 0.9rem;
            margin: 15px 0;
        }

        /* ================= REQUIREMENTS ================= */

        .requirements-title {
            margin: 15px 0 7px;
            color: #22d3ee;
            font-size: 0.88rem;
            font-weight: 700;
        }

        .job-requirements {
            color: #94a3b8;
            line-height: 1.6;
            font-size: 0.86rem;
            white-space: pre-line;
        }

        /* ================= ACTIONS ================= */

        .job-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid rgba(56, 189, 248, 0.12);
        }

        .action-btn {
            flex: 1;
            padding: 10px 14px;
            border-radius: 9px;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.83rem;
            cursor: pointer;
            transition: 0.25s ease;
        }

        .edit-btn {
            color: #67e8f9;
            background: rgba(34, 211, 238, 0.08);
            border: 1px solid rgba(34, 211, 238, 0.28);
        }

        .edit-btn:hover {
            background: rgba(34, 211, 238, 0.16);
            box-shadow: 0 0 18px rgba(34, 211, 238, 0.12);
            transform: translateY(-2px);
        }

        .delete-btn {
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.28);
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.15);
            box-shadow: 0 0 18px rgba(239, 68, 68, 0.10);
            transform: translateY(-2px);
        }

        /* ================= EMPTY STATE ================= */

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 65px 25px;
            border-radius: 18px;
            background: rgba(14, 29, 52, 0.70);
            border: 1px dashed rgba(56, 189, 248, 0.28);
            color: #94a3b8;
        }

        .empty-state h2 {
            margin: 0 0 10px;
            color: #38bdf8;
            font-size: 1.35rem;
        }

        .empty-state p {
            margin: 0 0 20px;
        }

        /* ================= ALERT ================= */

        .page-alert {
            display: none;
            margin-bottom: 20px;
            padding: 13px 15px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .page-alert.success {
            display: block;
            color: #86efac;
            background: rgba(34, 197, 94, 0.10);
            border: 1px solid rgba(34, 197, 94, 0.30);
        }

        .page-alert.error {
            display: block;
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.10);
            border: 1px solid rgba(239, 68, 68, 0.30);
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 700px) {

            .jobs-page {
                padding: 25px 18px;
            }

            .jobs-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-actions {
                width: 100%;
            }

            .tech-btn {
                flex: 1;
                text-align: center;
            }

            .search-panel {
                flex-direction: column;
            }

            .jobs-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 450px) {

            .jobs-page {
                padding: 18px 12px;
            }

            .jobs-header h1 {
                font-size: 1.6rem;
            }

            .job-card {
                padding: 20px;
            }

            .job-top {
                flex-direction: column;
            }

            .job-actions {
                flex-direction: column;
            }

            .action-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="jobs-page">

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <div class="jobs-header">

        <div>
            <h1>My Jobs</h1>
            <p>Manage the jobs posted by your company.</p>
        </div>

        <div class="header-actions">

            <a href="recruiter-dashboard.html" class="tech-btn">
                ← Dashboard
            </a>

            <a href="recruiter-dashboard.html#postJob" class="tech-btn">
                + Post New Job
            </a>

            <button
                type="button"
                class="tech-btn"
                onclick="loadJobs()">
                ↻ Refresh
            </button>

        </div>

    </div>


    <!-- =====================================================
         ALERT
         ===================================================== -->

    <div id="pageAlert" class="page-alert"></div>


    <!-- =====================================================
         SEARCH
         ===================================================== -->

    <div class="search-panel">

        <input
            type="text"
            id="searchInput"
            class="search-box"
            placeholder="Search by job title, location, employment type..."
            autocomplete="off">

    </div>


    <!-- =====================================================
         JOB COUNT
         ===================================================== -->

    <div class="job-count">
        Showing <strong id="jobCount">0</strong> jobs
    </div>


    <!-- =====================================================
         JOBS
         ===================================================== -->

    <div id="jobsContainer" class="jobs-grid">

        <div class="empty-state">
            <h2>Loading Jobs...</h2>
            <p>Please wait while your jobs are loaded.</p>
        </div>

    </div>

</div>


<script>

    // =========================================================
    // RECRUITER LOGIN
    // =========================================================

    const recruiterId = localStorage.getItem("recruiterId");


    if (!recruiterId) {

        alert("Please login first.");

        window.location.href = "recruiter-login.html";
    }


    // =========================================================
    // GLOBAL JOB DATA
    // =========================================================

    let allJobs = [];


    // =========================================================
    // LOAD JOBS
    // =========================================================

    async function loadJobs() {

        const container =
            document.getElementById("jobsContainer");

        container.innerHTML = `
            <div class="empty-state">
                <h2>Loading Jobs...</h2>
                <p>Please wait while your jobs are loaded.</p>
            </div>
        `;

        try {

            const response = await fetch(
                `/api/recruiter/jobs/recruiter/${recruiterId}`
            );


            if (!response.ok) {

                let errorMessage = "Unable to load jobs.";

                try {

                    const errorData =
                        await response.json();

                    errorMessage =
                        errorData.message || errorMessage;

                } catch (e) {
                    // Ignore JSON parsing error
                }

                throw new Error(errorMessage);
            }


            const jobs = await response.json();


            allJobs = Array.isArray(jobs)
                ? jobs
                : [];


            displayJobs(allJobs);


        } catch (error) {

            console.error("Load jobs error:", error);

            document.getElementById("jobCount")
                .textContent = "0";

            container.innerHTML = `
                <div class="empty-state">
                    <h2>Unable to Load Jobs</h2>
                    <p>${escapeHtml(error.message)}</p>
                    <button
                        class="tech-btn"
                        onclick="loadJobs()">
                        Try Again
                    </button>
                </div>
            `;
        }
    }


    // =========================================================
    // DISPLAY JOBS
    // =========================================================

    function displayJobs(jobs) {

        const container =
            document.getElementById("jobsContainer");


        document.getElementById("jobCount")
            .textContent = jobs.length;


        if (jobs.length === 0) {

            container.innerHTML = `
                <div class="empty-state">

                    <h2>No Jobs Posted Yet</h2>

                    <p>
                        Your company has not posted any jobs.
                    </p>

                    <a
                        href="recruiter-dashboard.html#postJob"
                        class="tech-btn">
                        + Post Your First Job
                    </a>

                </div>
            `;

            return;
        }


        container.innerHTML = "";


        jobs.forEach(function(job) {

            const card =
                document.createElement("div");

            card.className = "job-card";


            const title =
                escapeHtml(job.title || "Untitled Job");

            const company =
                escapeHtml(
                    job.company ||
                    job.recruiter?.companyName ||
                    "Your Company"
                );

            const location =
                escapeHtml(
                    job.location || "Location not specified"
                );

            const employmentType =
                escapeHtml(
                    job.employmentType ||
                    "Not specified"
                );

            const description =
                escapeHtml(
                    job.description ||
                    "No description provided."
                );

            const requirements =
                escapeHtml(
                    job.requirements ||
                    "No requirements specified."
                );


            card.innerHTML = `

                <div class="job-top">

                    <div>

                        <h2 class="job-title">
                            ${title}
                        </h2>

                        <div class="job-company">
                            ${company}
                        </div>

                    </div>

                    <span class="job-badge">
                        ${employmentType}
                    </span>

                </div>


                <div class="job-info">

                    <span>
                        📍 ${location}
                    </span>

                    <span>
                        💼 ${employmentType}
                    </span>

                </div>


                <p class="job-description">
                    ${description}
                </p>


                <div class="requirements-title">
                    Requirements
                </div>

                <div class="job-requirements">
                    ${requirements}
                </div>


                <div class="job-actions">

                    <button
                        type="button"
                        class="action-btn edit-btn"
                        onclick="editJob(${job.id})">
                        ✏ Edit
                    </button>

                    <button
                        type="button"
                        class="action-btn delete-btn"
                        onclick="deleteJob(${job.id})">
                        🗑 Delete
                    </button>

                </div>

            `;


            container.appendChild(card);

        });
    }


    // =========================================================
    // SEARCH
    // =========================================================

    document.getElementById("searchInput")
        .addEventListener("input", function() {

            const searchText =
                this.value.trim().toLowerCase();


            if (!searchText) {

                displayJobs(allJobs);

                return;
            }


            const filteredJobs =
                allJobs.filter(function(job) {

                    const title =
                        (job.title || "")
                            .toLowerCase();

                    const location =
                        (job.location || "")
                            .toLowerCase();

                    const type =
                        (job.employmentType || "")
                            .toLowerCase();

                    const description =
                        (job.description || "")
                            .toLowerCase();

                    const requirements =
                        (job.requirements || "")
                            .toLowerCase();


                    return (
                        title.includes(searchText) ||
                        location.includes(searchText) ||
                        type.includes(searchText) ||
                        description.includes(searchText) ||
                        requirements.includes(searchText)
                    );

                });


            displayJobs(filteredJobs);

        });


    // =========================================================
    // EDIT JOB
    // =========================================================

    async function editJob(jobId) {

        try {

            const response = await fetch(
                `/api/recruiter/jobs/${jobId}`
            );


            if (!response.ok) {

                throw new Error(
                    "Unable to load job details."
                );
            }


            const job =
                await response.json();


            /*
             * Store the selected job in localStorage.
             * The dashboard can use this information
             * when opening the Post Job section.
             */

            localStorage.setItem(
                "editingJob",
                JSON.stringify(job)
            );


            window.location.href =
                "recruiter-dashboard.html#postJob";


        } catch (error) {

            console.error(error);

            showAlert(
                error.message,
                "error"
            );
        }
    }


    // =========================================================
    // DELETE JOB
    // =========================================================

    async function deleteJob(jobId) {

        const confirmed =
            confirm(
                "Are you sure you want to delete this job?"
            );


        if (!confirmed) {
            return;
        }


        try {

            const response = await fetch(
                `/api/recruiter/jobs/${jobId}?recruiterId=${recruiterId}`,
                {
                    method: "DELETE"
                }
            );


            if (!response.ok) {

                let errorMessage =
                    "Unable to delete job.";

                try {

                    const errorData =
                        await response.json();

                    errorMessage =
                        errorData.message ||
                        errorMessage;

                } catch (e) {
                    // Ignore JSON parsing error
                }

                throw new Error(errorMessage);
            }


            showAlert(
                "Job deleted successfully!",
                "success"
            );


            await loadJobs();


        } catch (error) {

            console.error("Delete job error:", error);

            showAlert(
                error.message,
                "error"
            );
        }
    }


    // =========================================================
    // ALERT
    // =========================================================

    function showAlert(message, type) {

        const alertBox =
            document.getElementById("pageAlert");


        alertBox.textContent = message;

        alertBox.className =
            "page-alert " + type;


        setTimeout(function() {

            alertBox.className =
                "page-alert";

            alertBox.textContent = "";

        }, 4000);
    }


    // =========================================================
    // HTML ESCAPING
    // =========================================================

    function escapeHtml(value) {

        const div =
            document.createElement("div");

        div.textContent =
            value ?? "";

        return div.innerHTML;
    }


    // =========================================================
    // INITIAL LOAD
    // =========================================================

    loadJobs();

</script>

</body>
</html>
