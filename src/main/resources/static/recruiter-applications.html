<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Applications - Job Portal</title>

    <link rel="stylesheet" href="css/recruiter.css">

    <style>

        /* =====================================================
           RECRUITER APPLICATIONS PAGE
           ===================================================== */

        .applications-page {
            min-height: 100vh;
            padding: 35px;
        }

        /* ================= HEADER ================= */

        .applications-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(56, 189, 248, 0.22);
        }

        .applications-header h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 800;

            background: linear-gradient(
                90deg,
                #38bdf8,
                #22d3ee,
                #8b5cf6
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .applications-header p {
            margin: 8px 0 0;
            color: #94a3b8;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tech-btn {
            padding: 11px 18px;
            border: 1px solid rgba(56, 189, 248, 0.35);
            border-radius: 10px;

            background: rgba(14, 165, 233, 0.10);
            color: #22d3ee;

            font-weight: 700;
            cursor: pointer;
            text-decoration: none;

            transition: 0.25s ease;
        }

        .tech-btn:hover {
            transform: translateY(-2px);

            background: rgba(34, 211, 238, 0.16);

            box-shadow:
                0 0 20px rgba(34, 211, 238, 0.18);
        }

        /* ================= SEARCH ================= */

        .search-panel {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            padding: 18px;

            border-radius: 16px;

            background: rgba(14, 29, 52, 0.75);
            border: 1px solid rgba(56, 189, 248, 0.18);

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.20);
        }

        .search-box,
        .status-filter {
            padding: 13px 15px;

            border: 1px solid rgba(148, 163, 184, 0.22);
            border-radius: 10px;

            background: rgba(5, 15, 30, 0.75);
            color: #f1f5f9;

            font-family: inherit;
            font-size: 0.94rem;

            outline: none;
            transition: 0.25s ease;
        }

        .search-box {
            flex: 1;
        }

        .status-filter {
            min-width: 170px;
        }

        .search-box::placeholder {
            color: #64748b;
        }

        .search-box:focus,
        .status-filter:focus {
            border-color: #22d3ee;

            box-shadow:
                0 0 0 3px rgba(34, 211, 238, 0.10),
                0 0 20px rgba(34, 211, 238, 0.08);
        }

        .status-filter option {
            background: #0b1830;
            color: white;
        }

        /* ================= COUNT ================= */

        .application-count {
            margin-bottom: 20px;
            color: #94a3b8;
            font-size: 0.95rem;
        }

        .application-count strong {
            color: #22d3ee;
        }

        /* ================= APPLICATION GRID ================= */

        .applications-grid {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(340px, 1fr));

            gap: 22px;
        }

        /* ================= APPLICATION CARD ================= */

        .application-card {
            position: relative;

            padding: 25px;

            border-radius: 18px;

            background: rgba(14, 29, 52, 0.88);

            border: 1px solid rgba(56, 189, 248, 0.20);

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.30);

            overflow: hidden;

            transition: 0.3s ease;
        }

        .application-card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 3px;

            background: linear-gradient(
                90deg,
                #38bdf8,
                #22d3ee,
                #8b5cf6
            );
        }

        .application-card:hover {
            transform: translateY(-5px);

            border-color:
                rgba(34, 211, 238, 0.45);

            box-shadow:
                0 20px 45px rgba(0, 0, 0, 0.40),
                0 0 25px rgba(14, 165, 233, 0.10);
        }

        /* ================= CANDIDATE ================= */

        .candidate-header {
            display: flex;

            justify-content: space-between;
            align-items: flex-start;

            gap: 15px;
        }

        .candidate-name {
            margin: 0 0 6px;

            color: #38bdf8;

            font-size: 1.25rem;
        }

        .candidate-email {
            color: #94a3b8;

            font-size: 0.85rem;
        }

        /* ================= STATUS ================= */

        .status-badge {
            padding: 6px 10px;

            border-radius: 20px;

            font-size: 0.75rem;
            font-weight: 700;

            white-space: nowrap;
        }

        .status-applied {
            color: #67e8f9;

            background:
                rgba(34, 211, 238, 0.10);

            border:
                1px solid rgba(34, 211, 238, 0.25);
        }

        .status-shortlisted {
            color: #86efac;

            background:
                rgba(34, 197, 94, 0.10);

            border:
                1px solid rgba(34, 197, 94, 0.25);
        }

        .status-rejected {
            color: #fca5a5;

            background:
                rgba(239, 68, 68, 0.10);

            border:
                1px solid rgba(239, 68, 68, 0.25);
        }

        /* ================= DETAILS ================= */

        .application-info {
            margin: 20px 0;

            display: flex;

            flex-direction: column;

            gap: 10px;
        }

        .info-row {
            display: flex;

            justify-content: space-between;

            gap: 15px;

            padding: 9px 11px;

            border-radius: 8px;

            background:
                rgba(5, 15, 30, 0.55);
        }

        .info-label {
            color: #64748b;

            font-size: 0.82rem;
        }

        .info-value {
            color: #cbd5e1;

            font-size: 0.84rem;

            text-align: right;
        }

        /* ================= COVER LETTER ================= */

        .cover-title {
            margin-bottom: 7px;

            color: #22d3ee;

            font-size: 0.88rem;

            font-weight: 700;
        }

        .cover-letter {
            color: #94a3b8;

            font-size: 0.86rem;

            line-height: 1.6;

            margin-bottom: 20px;
        }

        /* ================= ACTIONS ================= */

        .application-actions {
            display: flex;

            gap: 10px;

            padding-top: 18px;

            border-top:
                1px solid rgba(56, 189, 248, 0.12);

            flex-wrap: wrap;
        }

        .action-btn {
            flex: 1;

            min-width: 120px;

            padding: 10px 12px;

            border-radius: 9px;

            font-family: inherit;

            font-weight: 700;

            font-size: 0.82rem;

            cursor: pointer;

            transition: 0.25s ease;
        }

        .shortlist-btn {
            color: #86efac;

            background:
                rgba(34, 197, 94, 0.08);

            border:
                1px solid rgba(34, 197, 94, 0.28);
        }

        .shortlist-btn:hover {
            background:
                rgba(34, 197, 94, 0.16);

            transform: translateY(-2px);
        }

        .reject-btn {
            color: #fca5a5;

            background:
                rgba(239, 68, 68, 0.08);

            border:
                1px solid rgba(239, 68, 68, 0.28);
        }

        .reject-btn:hover {
            background:
                rgba(239, 68, 68, 0.16);

            transform: translateY(-2px);
        }

        /* ================= SCHEDULE BUTTON ================= */

        .schedule-btn {
            flex: 1;

            min-width: 180px;

            padding: 10px 12px;

            border-radius: 9px;

            color: #67e8f9;

            background:
                rgba(14, 165, 233, 0.10);

            border:
                1px solid rgba(34, 211, 238, 0.30);

            font-family: inherit;

            font-weight: 700;

            font-size: 0.82rem;

            cursor: pointer;

            transition: 0.25s ease;
        }

        .schedule-btn:hover {
            background:
                rgba(34, 211, 238, 0.17);

            transform: translateY(-2px);

            box-shadow:
                0 0 18px rgba(34, 211, 238, 0.12);
        }

        .schedule-btn.scheduled {
            color: #86efac;

            border-color:
                rgba(34, 197, 94, 0.28);

            background:
                rgba(34, 197, 94, 0.08);

            cursor: default;
        }

        .schedule-btn.scheduled:hover {
            transform: none;

            box-shadow: none;
        }

        /* ================= EMPTY ================= */

        .empty-state {
            grid-column: 1 / -1;

            text-align: center;

            padding: 65px 25px;

            border-radius: 18px;

            background:
                rgba(14, 29, 52, 0.70);

            border:
                1px dashed rgba(56, 189, 248, 0.28);

            color: #94a3b8;
        }

        .empty-state h2 {
            margin: 0 0 10px;

            color: #38bdf8;
        }

        /* =====================================================
           INTERVIEW MODAL
           ===================================================== */

        .modal-overlay {
            position: fixed;

            inset: 0;

            display: none;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                rgba(2, 6, 23, 0.82);

            backdrop-filter: blur(8px);

            z-index: 9999;
        }

        .modal-overlay.active {
            display: flex;
        }

        .interview-modal {
            width: 100%;

            max-width: 600px;

            max-height: 90vh;

            overflow-y: auto;

            padding: 30px;

            border-radius: 20px;

            background:
                linear-gradient(
                    145deg,
                    rgba(14, 29, 52, 0.98),
                    rgba(7, 18, 36, 0.98)
                );

            border:
                1px solid rgba(56, 189, 248, 0.30);

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.55),
                0 0 40px rgba(14, 165, 233, 0.10);

            animation:
                modalAppear 0.25s ease;
        }

        @keyframes modalAppear {

            from {
                opacity: 0;
                transform: translateY(20px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }

        .modal-header {
            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 20px;

            margin-bottom: 25px;

            padding-bottom: 18px;

            border-bottom:
                1px solid rgba(56, 189, 248, 0.15);
        }

        .modal-header h2 {
            margin: 0;

            color: #38bdf8;

            font-size: 1.5rem;
        }

        .modal-header p {
            margin: 7px 0 0;

            color: #94a3b8;

            font-size: 0.86rem;
        }

        .close-modal {
            width: 36px;

            height: 36px;

            border-radius: 50%;

            border:
                1px solid rgba(148, 163, 184, 0.22);

            background:
                rgba(148, 163, 184, 0.08);

            color: #cbd5e1;

            font-size: 1.2rem;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .close-modal:hover {
            color: white;

            background:
                rgba(239, 68, 68, 0.15);

            border-color:
                rgba(239, 68, 68, 0.35);
        }

        /* ================= FORM ================= */

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            color: #cbd5e1;

            font-size: 0.86rem;

            font-weight: 700;
        }

        .form-group label span {
            color: #f87171;
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;

            box-sizing: border-box;

            padding: 12px 14px;

            border-radius: 10px;

            border:
                1px solid rgba(148, 163, 184, 0.22);

            background:
                rgba(5, 15, 30, 0.80);

            color: #f1f5f9;

            font-family: inherit;

            font-size: 0.9rem;

            outline: none;

            transition: 0.25s ease;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            border-color: #22d3ee;

            box-shadow:
                0 0 0 3px rgba(34, 211, 238, 0.08);
        }

        .form-input::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        .form-select option {
            background: #0b1830;

            color: white;
        }

        .form-textarea {
            min-height: 90px;

            resize: vertical;
        }

        .form-row {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 15px;
        }

        .conditional-field {
            display: none;
        }

        .conditional-field.show {
            display: block;
        }

        /* ================= MODAL ACTIONS ================= */

        .modal-actions {
            display: flex;

            justify-content: flex-end;

            gap: 12px;

            margin-top: 25px;

            padding-top: 20px;

            border-top:
                1px solid rgba(56, 189, 248, 0.12);
        }

        .modal-cancel {
            padding: 11px 20px;

            border-radius: 10px;

            color: #cbd5e1;

            background:
                rgba(148, 163, 184, 0.08);

            border:
                1px solid rgba(148, 163, 184, 0.22);

            font-family: inherit;

            font-weight: 700;

            cursor: pointer;
        }

        .modal-submit {
            padding: 11px 22px;

            border-radius: 10px;

            color: #04111f;

            background:
                linear-gradient(
                    90deg,
                    #38bdf8,
                    #22d3ee
                );

            border: none;

            font-family: inherit;

            font-weight: 800;

            cursor: pointer;

            transition: 0.25s ease;
        }

        .modal-submit:hover {
            transform: translateY(-2px);

            box-shadow:
                0 0 25px rgba(34, 211, 238, 0.25);
        }

        .modal-submit:disabled {
            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }

        /* ================= MESSAGE ================= */

        .form-message {
            display: none;

            margin-bottom: 18px;

            padding: 12px 14px;

            border-radius: 10px;

            font-size: 0.86rem;

            line-height: 1.5;
        }

        .form-message.error {
            display: block;

            color: #fca5a5;

            background:
                rgba(239, 68, 68, 0.10);

            border:
                1px solid rgba(239, 68, 68, 0.25);
        }

        .form-message.success {
            display: block;

            color: #86efac;

            background:
                rgba(34, 197, 94, 0.10);

            border:
                1px solid rgba(34, 197, 94, 0.25);
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 700px) {

            .applications-page {
                padding: 25px 18px;
            }

            .applications-header {
                flex-direction: column;

                align-items: flex-start;
            }

            .search-panel {
                flex-direction: column;
            }

            .status-filter {
                width: 100%;
            }

            .applications-grid {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 450px) {

            .applications-page {
                padding: 18px 12px;
            }

            .applications-header h1 {
                font-size: 1.6rem;
            }

            .application-card {
                padding: 20px;
            }

            .candidate-header {
                flex-direction: column;
            }

            .application-actions {
                flex-direction: column;
            }

            .action-btn,
            .schedule-btn {
                width: 100%;
            }

            .interview-modal {
                padding: 22px;
            }

            .modal-actions {
                flex-direction: column;
            }

            .modal-cancel,
            .modal-submit {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<div class="applications-page">


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <div class="applications-header">

        <div>

            <h1>Applications</h1>

            <p>
                Manage candidates who applied for your jobs.
            </p>

        </div>


        <div class="header-actions">

            <a
                href="recruiter-dashboard.html"
                class="tech-btn">

                ← Dashboard

            </a>


            <button
                type="button"
                class="tech-btn"
                onclick="loadApplications()">

                ↻ Refresh

            </button>

        </div>

    </div>



    <!-- =====================================================
         SEARCH + FILTER
         ===================================================== -->

    <div class="search-panel">

        <input
            type="text"
            id="searchInput"
            class="search-box"
            placeholder="Search candidate, email, job title..."
            autocomplete="off">


        <select
            id="statusFilter"
            class="status-filter">

            <option value="all">
                All Applications
            </option>

            <option value="Applied">
                Applied
            </option>

            <option value="Shortlisted">
                Shortlisted
            </option>

            <option value="Rejected">
                Rejected
            </option>

        </select>

    </div>



    <!-- =====================================================
         COUNT
         ===================================================== -->

    <div class="application-count">

        Showing

        <strong id="applicationCount">
            0
        </strong>

        applications

    </div>



    <!-- =====================================================
         APPLICATIONS
         ===================================================== -->

    <div
        id="applicationsContainer"
        class="applications-grid">

        <div class="empty-state">

            <h2>Loading Applications...</h2>

            <p>
                Please wait while applications are loaded.
            </p>

        </div>

    </div>

</div>



<!-- =========================================================
     INTERVIEW MODAL
     ========================================================= -->

<div
    id="interviewModal"
    class="modal-overlay">

    <div class="interview-modal">


        <!-- HEADER -->

        <div class="modal-header">

            <div>

                <h2>
                    📅 Schedule Interview
                </h2>

                <p id="interviewCandidate">
                    Candidate
                </p>

            </div>


            <button
                type="button"
                class="close-modal"
                onclick="closeInterviewModal()">

                ×

            </button>

        </div>



        <!-- MESSAGE -->

        <div
            id="formMessage"
            class="form-message">
        </div>



        <!-- FORM -->

        <form
            id="interviewForm">


            <!-- DATE + TIME -->

            <div class="form-row">


                <div class="form-group">

                    <label for="interviewDate">
                        Interview Date
                        <span>*</span>
                    </label>

                    <input
                        type="date"
                        id="interviewDate"
                        class="form-input"
                        required>

                </div>



                <div class="form-group">

                    <label for="interviewTime">
                        Interview Time
                        <span>*</span>
                    </label>

                    <input
                        type="time"
                        id="interviewTime"
                        class="form-input"
                        required>

                </div>

            </div>



            <!-- MODE -->

            <div class="form-group">

                <label for="interviewMode">
                    Interview Mode
                    <span>*</span>
                </label>

                <select
                    id="interviewMode"
                    class="form-select"
                    required>

                    <option value="">
                        Select Mode
                    </option>

                    <option value="Online">
                        Online
                    </option>

                    <option value="Offline">
                        Offline
                    </option>

                </select>

            </div>



            <!-- MEETING LINK -->

            <div
                id="meetingLinkField"
                class="form-group conditional-field">

                <label for="meetingLink">
                    Meeting Link
                    <span>*</span>
                </label>

                <input
                    type="url"
                    id="meetingLink"
                    class="form-input"
                    placeholder="https://meet.google.com/...">

            </div>



            <!-- LOCATION -->

            <div
                id="locationField"
                class="form-group conditional-field">

                <label for="interviewLocation">
                    Interview Location
                    <span>*</span>
                </label>

                <input
                    type="text"
                    id="interviewLocation"
                    class="form-input"
                    placeholder="Office / Building / Room">

            </div>



            <!-- NOTES -->

            <div class="form-group">

                <label for="interviewNotes">
                    Notes
                </label>

                <textarea
                    id="interviewNotes"
                    class="form-textarea"
                    placeholder="Add instructions or additional information for the candidate...">
                </textarea>

            </div>



            <!-- ACTIONS -->

            <div class="modal-actions">

                <button
                    type="button"
                    class="modal-cancel"
                    onclick="closeInterviewModal()">

                    Cancel

                </button>


                <button
                    type="submit"
                    id="scheduleSubmitBtn"
                    class="modal-submit">

                    Schedule Interview

                </button>

            </div>

        </form>

    </div>

</div>



<script>


    // =========================================================
    // RECRUITER LOGIN CHECK
    // =========================================================

    const recruiterId =
        localStorage.getItem("recruiterId");


    if (!recruiterId) {

        alert("Please login first.");

        window.location.href =
            "recruiter-login.html";

    }



    // =========================================================
    // APPLICATION DATA
    // =========================================================

    let allApplications = [];

    let selectedApplicationId = null;



    // =========================================================
    // LOAD APPLICATIONS
    // =========================================================

    async function loadApplications() {

        try {

            const recruiterId =
                localStorage.getItem("recruiterId");


            if (!recruiterId) {

                alert(
                    "Please login as a recruiter first."
                );

                window.location.href =
                    "recruiter-login.html";

                return;
            }



            const response =
                await fetch(
                    `/api/applications/recruiter/${recruiterId}`
                );


            if (!response.ok) {

                throw new Error(
                    "Failed to load applications"
                );

            }



            const applications =
                await response.json();


                allApplications =
    applications.map(
        application => ({

            id:
                application.id,

            candidateName:
                application.candidate?.name
                ||
                "Unknown Candidate",

            email:
                application.candidate?.email
                ||
                "No email",

            phone:
                application.candidate?.phone
                ||
                "No phone",

            jobTitle:
                application.job?.title
                ||
                "Unknown Job",

            status:
                application.status
                ||
                "Applied",

            appliedDate:
                application.appliedDate,

            coverLetter:
                application.coverLetter
                ||
                "",

            interviewScheduled:
                false

        })
    );
    // =========================================================
// CHECK WHICH APPLICATIONS ALREADY HAVE INTERVIEWS
// =========================================================

await Promise.all(
    allApplications.map(async function(application) {

        try {

            const response =
                await fetch(
                    `/api/interviews/application/${application.id}/exists`
                );

            if (response.ok) {

                application.interviewScheduled =
                    await response.json();

            }

        } catch (error) {

            console.error(
                `Error checking interview for application ${application.id}:`,
                error
            );

            application.interviewScheduled =
                false;
        }

    })
);


            displayApplications(
                allApplications
            );


        } catch (error) {

            console.error(
                "Error loading applications:",
                error
            );

            alert(
                "Unable to load applications."
            );

        }

    }



    // =========================================================
    // DISPLAY APPLICATIONS
    // =========================================================

    function displayApplications(
        applications
    ) {

        const container =
            document.getElementById(
                "applicationsContainer"
            );


        document.getElementById(
            "applicationCount"
        ).textContent =
            applications.length;



        if (
            applications.length === 0
        ) {

            container.innerHTML = `

                <div class="empty-state">

                    <h2>
                        No Applications Yet
                    </h2>

                    <p>
                        Applications from candidates
                        will appear here.
                    </p>

                </div>

            `;

            return;

        }



        container.innerHTML = "";



        applications.forEach(
            function(application) {


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "application-card";



                const status =
                    application.status
                    ||
                    "Applied";



                let statusClass =
                    "status-applied";


                if (
                    status ===
                    "Shortlisted"
                ) {

                    statusClass =
                        "status-shortlisted";

                }


                if (
                    status ===
                    "Rejected"
                ) {

                    statusClass =
                        "status-rejected";

                }

                // -----------------------------------------
// SCHEDULE / SCHEDULED BUTTON
// -----------------------------------------

let scheduleButton = "";

if (
    status === "Shortlisted"
) {

    if (
        application.interviewScheduled
    ) {

        scheduleButton = `

            <button
                class="schedule-btn scheduled"
                type="button"
                disabled>

                ✓ Interview Scheduled

            </button>

        `;

    } else {

        scheduleButton = `

            <button
                class="schedule-btn"
                onclick="openInterviewModal(
                    ${application.id},
                    '${escapeJs(application.candidateName)}'
                )">

                📅 Schedule Interview

            </button>

        `;

    }

}



                // -----------------------------------------
                // APPLICATION CARD
                // -----------------------------------------

                card.innerHTML = `

                    <div class="candidate-header">

                        <div>

                            <h2 class="candidate-name">

                                ${escapeHtml(
                                    application.candidateName
                                    ||
                                    "Candidate"
                                )}

                            </h2>


                            <div class="candidate-email">

                                ${escapeHtml(
                                    application.email
                                    ||
                                    "No email provided"
                                )}

                            </div>

                        </div>



                        <span
                            class="status-badge ${statusClass}">

                            ${escapeHtml(status)}

                        </span>

                    </div>



                    <div class="application-info">


                        <div class="info-row">

                            <span class="info-label">
                                Job
                            </span>

                            <span class="info-value">

                                ${escapeHtml(
                                    application.jobTitle
                                    ||
                                    "Unknown Job"
                                )}

                            </span>

                        </div>



                        <div class="info-row">

                            <span class="info-label">
                                Applied On
                            </span>

                            <span class="info-value">

                                ${escapeHtml(
                                    formatDate(
                                        application.appliedDate
                                    )
                                )}

                            </span>

                        </div>



                        <div class="info-row">

                            <span class="info-label">
                                Phone
                            </span>

                            <span class="info-value">

                                ${escapeHtml(
                                    application.phone
                                    ||
                                    "Not provided"
                                )}

                            </span>

                        </div>

                    </div>



                    <div class="cover-title">

                        Cover Letter

                    </div>



                    <div class="cover-letter">

                        ${escapeHtml(
                            application.coverLetter
                            ||
                            "No cover letter provided."
                        )}

                    </div>



                    <div class="application-actions">


                        <button
                            class="action-btn shortlist-btn"
                            onclick="updateStatus(
                                ${application.id},
                                'Shortlisted'
                            )">

                            ✓ Shortlist

                        </button>



                        <button
                            class="action-btn reject-btn"
                            onclick="updateStatus(
                                ${application.id},
                                'Rejected'
                            )">

                            ✕ Reject

                        </button>



                        ${scheduleButton}


                    </div>

                `;



                container.appendChild(card);

            }
        );

    }



    // =========================================================
    // OPEN INTERVIEW MODAL
    // =========================================================

    function openInterviewModal(
        applicationId,
        candidateName
    ) {

        selectedApplicationId =
            applicationId;


        document.getElementById(
            "interviewCandidate"
        ).textContent =
            `Schedule an interview for ${candidateName}`;


        document.getElementById(
            "interviewModal"
        ).classList.add("active");


        document.getElementById(
            "interviewForm"
        ).reset();


        document.getElementById(
            "meetingLinkField"
        ).classList.remove("show");


        document.getElementById(
            "locationField"
        ).classList.remove("show");


        clearFormMessage();

    }



    // =========================================================
    // CLOSE INTERVIEW MODAL
    // =========================================================

    function closeInterviewModal() {

        document.getElementById(
            "interviewModal"
        ).classList.remove("active");


        selectedApplicationId =
            null;


        clearFormMessage();

    }



    // =========================================================
    // MODE CHANGE
    // =========================================================

    document.getElementById(
        "interviewMode"
    ).addEventListener(
        "change",
        function() {

            const mode =
                this.value;


            const meetingLinkField =
                document.getElementById(
                    "meetingLinkField"
                );


            const locationField =
                document.getElementById(
                    "locationField"
                );


            const meetingLink =
                document.getElementById(
                    "meetingLink"
                );


            const location =
                document.getElementById(
                    "interviewLocation"
                );



            if (
                mode === "Online"
            ) {

                meetingLinkField
                    .classList
                    .add("show");

                locationField
                    .classList
                    .remove("show");


                meetingLink.required =
                    true;

                location.required =
                    false;

                location.value =
                    "";


            }
            else if (
                mode === "Offline"
            ) {

                locationField
                    .classList
                    .add("show");

                meetingLinkField
                    .classList
                    .remove("show");


                location.required =
                    true;

                meetingLink.required =
                    false;

                meetingLink.value =
                    "";


            }
            else {

                meetingLinkField
                    .classList
                    .remove("show");

                locationField
                    .classList
                    .remove("show");


                meetingLink.required =
                    false;

                location.required =
                    false;

            }

        }
    );



    // =========================================================
    // SCHEDULE INTERVIEW
    // =========================================================

    document.getElementById(
        "interviewForm"
    ).addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();



            if (
                !selectedApplicationId
            ) {

                showFormMessage(
                    "Application information is missing.",
                    "error"
                );

                return;

            }



            const recruiterId =
                localStorage.getItem(
                    "recruiterId"
                );


            if (!recruiterId) {

                showFormMessage(
                    "Recruiter login is required.",
                    "error"
                );

                return;

            }



            const date =
                document.getElementById(
                    "interviewDate"
                ).value;


            const time =
                document.getElementById(
                    "interviewTime"
                ).value;


            const mode =
                document.getElementById(
                    "interviewMode"
                ).value;


            const location =
                document.getElementById(
                    "interviewLocation"
                ).value.trim();


            const meetingLink =
                document.getElementById(
                    "meetingLink"
                ).value.trim();


            const notes =
                document.getElementById(
                    "interviewNotes"
                ).value.trim();



            if (
                !date ||
                !time ||
                !mode
            ) {

                showFormMessage(
                    "Please fill in all required fields.",
                    "error"
                );

                return;

            }



            // ---------------------------------------------
            // CHECK DATE/TIME
            // ---------------------------------------------

            const interviewDateTime =
                new Date(
                    `${date}T${time}`
                );


            if (
                Number.isNaN(
                    interviewDateTime.getTime()
                )
            ) {

                showFormMessage(
                    "Please enter a valid interview date and time.",
                    "error"
                );

                return;

            }



            if (
                interviewDateTime
                <=
                new Date()
            ) {

                showFormMessage(
                    "Interview date and time must be in the future.",
                    "error"
                );

                return;

            }



            // ---------------------------------------------
            // MODE VALIDATION
            // ---------------------------------------------

            if (
                mode === "Online" &&
                !meetingLink
            ) {

                showFormMessage(
                    "Please enter the online meeting link.",
                    "error"
                );

                return;

            }


            if (
                mode === "Offline" &&
                !location
            ) {

                showFormMessage(
                    "Please enter the interview location.",
                    "error"
                );

                return;

            }



            // ---------------------------------------------
            // LOCAL DATE TIME
            // ---------------------------------------------

            const localDateTime =
                `${date}T${time}`;



            // ---------------------------------------------
            // SUBMIT BUTTON
            // ---------------------------------------------

            const submitButton =
                document.getElementById(
                    "scheduleSubmitBtn"
                );


            submitButton.disabled =
                true;


            submitButton.textContent =
                "Scheduling...";



            try {


                // -----------------------------------------
                // BUILD REQUEST URL
                // -----------------------------------------

                const params =
                    new URLSearchParams();


                params.append(
                    "applicationId",
                    selectedApplicationId
                );


                params.append(
                    "recruiterId",
                    recruiterId
                );


                params.append(
                    "interviewDate",
                    localDateTime
                );


                params.append(
                    "mode",
                    mode
                );


                if (location) {

                    params.append(
                        "location",
                        location
                    );

                }


                if (meetingLink) {

                    params.append(
                        "meetingLink",
                        meetingLink
                    );

                }


                if (notes) {

                    params.append(
                        "notes",
                        notes
                    );

                }



                // -----------------------------------------
                // API REQUEST
                // -----------------------------------------

                const response =
                    await fetch(
                        `/api/interviews?${params.toString()}`,
                        {
                            method: "POST"
                        }
                    );



                if (!response.ok) {

                    const errorText =
                        await response.text();


                    throw new Error(
                        errorText ||
                        "Failed to schedule interview."
                    );

                }



                // -----------------------------------------
                // SUCCESS
                // -----------------------------------------

                showFormMessage(
                    "Interview scheduled successfully!",
                    "success"
                );


                submitButton.textContent =
                    "Scheduled ✓";



                // Give user time to see success
                setTimeout(
                    async function() {

                        closeInterviewModal();

                        await loadApplications();

                    },
                    1000
                );


            } catch (error) {

                console.error(
                    "Error scheduling interview:",
                    error
                );


                showFormMessage(
                    extractErrorMessage(error),
                    "error"
                );


                submitButton.disabled =
                    false;


                submitButton.textContent =
                    "Schedule Interview";

            }

        }
    );



    // =========================================================
    // SEARCH + FILTER
    // =========================================================

    function filterApplications() {

        const searchText =
            document.getElementById(
                "searchInput"
            )
            .value
            .trim()
            .toLowerCase();



        const selectedStatus =
            document.getElementById(
                "statusFilter"
            )
            .value;



        const filtered =
            allApplications.filter(
                function(application) {


                    const name =
                        (
                            application.candidateName
                            ||
                            ""
                        )
                        .toLowerCase();



                    const email =
                        (
                            application.email
                            ||
                            ""
                        )
                        .toLowerCase();



                    const jobTitle =
                        (
                            application.jobTitle
                            ||
                            ""
                        )
                        .toLowerCase();



                    const status =
                        application.status
                        ||
                        "Applied";



                    const matchesSearch =
                        name.includes(
                            searchText
                        )
                        ||
                        email.includes(
                            searchText
                        )
                        ||
                        jobTitle.includes(
                            searchText
                        );



                    const matchesStatus =
                        selectedStatus ===
                        "all"
                        ||
                        status ===
                        selectedStatus;



                    return (
                        matchesSearch &&
                        matchesStatus
                    );

                }
            );



        displayApplications(
            filtered
        );

    }



    document.getElementById(
        "searchInput"
    ).addEventListener(
        "input",
        filterApplications
    );



    document.getElementById(
        "statusFilter"
    ).addEventListener(
        "change",
        filterApplications
    );



    // =========================================================
    // UPDATE APPLICATION STATUS
    // =========================================================

    async function updateStatus(
        applicationId,
        status
    ) {

        try {

            const recruiterId =
                localStorage.getItem(
                    "recruiterId"
                );


            if (!recruiterId) {

                alert(
                    "Please login as a recruiter first."
                );

                return;

            }



            const response =
                await fetch(
                    `/api/applications/${applicationId}/status?recruiterId=${recruiterId}&status=${encodeURIComponent(status)}`,
                    {
                        method: "PUT"
                    }
                );



            if (!response.ok) {

                const errorText =
                    await response.text();


                throw new Error(
                    errorText ||
                    "Failed to update application"
                );

            }



            alert(
                `Application ${status.toLowerCase()} successfully!`
            );



            // Reload applications

            await loadApplications();


        } catch (error) {

            console.error(
                "Error updating application:",
                error
            );


            alert(
                "Unable to update application status."
            );

        }

    }



    // =========================================================
    // FORM MESSAGE
    // =========================================================

    function showFormMessage(
        message,
        type
    ) {

        const messageElement =
            document.getElementById(
                "formMessage"
            );


        messageElement.textContent =
            message;


        messageElement.className =
            `form-message ${type}`;

    }



    function clearFormMessage() {

        const messageElement =
            document.getElementById(
                "formMessage"
            );


        messageElement.textContent =
            "";


        messageElement.className =
            "form-message";

    }



    // =========================================================
    // ERROR MESSAGE
    // =========================================================

    function extractErrorMessage(
        error
    ) {

        if (
            error &&
            error.message
        ) {

            let message =
                error.message;


            // Clean common backend formatting

            if (
                message.includes(
                    "Only shortlisted"
                )
            ) {

                return (
                    "Only shortlisted candidates can have an interview scheduled."
                );

            }


            if (
                message.includes(
                    "already been scheduled"
                )
            ) {

                return (
                    "An interview has already been scheduled for this application."
                );

            }


            if (
                message.includes(
                    "future"
                )
            ) {

                return (
                    "Interview date and time must be in the future."
                );

            }


            return message;

        }


        return (
            "Unable to schedule the interview."
        );

    }



    // =========================================================
    // HTML ESCAPING
    // =========================================================

    function escapeHtml(
        value
    ) {

        const div =
            document.createElement(
                "div"
            );


        div.textContent =
            value ?? "";


        return div.innerHTML;

    }



    // =========================================================
    // JAVASCRIPT STRING ESCAPING
    // =========================================================

    function escapeJs(
        value
    ) {

        return String(
            value ?? ""
        )
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        )
        .replace(
            /"/g,
            '\\"'
        )
        .replace(
            /\n/g,
            "\\n"
        )
        .replace(
            /\r/g,
            "\\r"
        );

    }



    // =========================================================
    // DATE FORMATTING
    // =========================================================

    function formatDate(
        dateValue
    ) {

        if (!dateValue) {

            return "Not available";

        }


        try {

            const date =
                new Date(
                    dateValue
                );


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return String(
                    dateValue
                );

            }


            return date.toLocaleString();

        } catch (error) {

            return String(
                dateValue
            );

        }

    }



    // =========================================================
    // CLOSE MODAL WHEN CLICKING OUTSIDE
    // =========================================================

    document.getElementById(
        "interviewModal"
    ).addEventListener(
        "click",
        function(event) {

            if (
                event.target ===
                this
            ) {

                closeInterviewModal();

            }

        }
    );



    // =========================================================
    // ESC KEY CLOSES MODAL
    // =========================================================

    document.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Escape"
            ) {

                closeInterviewModal();

            }

        }
    );



    // =========================================================
    // INITIAL LOAD
    // =========================================================

    loadApplications();


</script>
