<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Experience</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .profile-nav { display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; }
        .profile-nav a { text-decoration: none; color: var(--text-muted); font-weight: 500; padding: 0.5rem 1rem; border-radius: 5px; }
        .profile-nav a.active { background-color: rgba(67, 97, 238, 0.1); color: var(--primary-color); }
        .timeline-item { border-left: 2px solid var(--success-color); padding-left: 1.5rem; margin-bottom: 1.5rem; position: relative; }
        .timeline-item::before { content: ''; position: absolute; left: -6px; top: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--success-color); }
        .item-actions { float: right; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">Job Portal</div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="profile.html" class="active">Profile Settings</a></li>
                <li><a href="jobs.html">Browse Jobs</a></li>
                <li><a href="#" id="logoutBtn">Logout</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <header class="header">
                <h1 class="page-title">Work Experience</h1>
            </header>
            
            <div id="alertMessage" class="alert"></div>

            <div class="profile-nav">
                <a href="profile.html">Basic Info</a>
                <a href="skills.html">Skills</a>
                <a href="education.html">Education</a>
                <a href="experience.html" class="active">Experience</a>
                <a href="resume.html">Resume</a>
            </div>

            <div class="content-card">
                <div class="card-header">
                    <h3>Add Experience</h3>
                </div>
                <form id="expForm">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label>Company Name</label>
                            <input type="text" id="company" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Job Title</label>
                            <input type="text" id="jobTitle" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Start Date</label>
                            <input type="date" id="startDate" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>End Date</label>
                            <input type="date" id="endDate" class="form-control">
                            <div style="margin-top: 0.5rem;">
                                <input type="checkbox" id="isCurrent"> <label for="isCurrent" style="display:inline; font-weight:normal;">I currently work here</label>
                            </div>
                        </div>
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label>Job Description</label>
                            <textarea id="description" class="form-control" rows="3"></textarea>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Experience</button>
                </form>
            </div>

            <div class="content-card">
                <h3>Your Work Experience</h3>
                <div id="expList" style="margin-top: 1.5rem;">
                    <!-- Populated via JS -->
                </div>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script>
        let currentUser = null;
        
        document.addEventListener('DOMContentLoaded', async () => {
            currentUser = await checkAuth();
            if (currentUser) {
                renderExperience(currentUser.experiences);
            }
        });

        document.getElementById('isCurrent').addEventListener('change', function(e) {
            document.getElementById('endDate').disabled = e.target.checked;
            if(e.target.checked) document.getElementById('endDate').value = '';
        });

        function renderExperience(experiences) {
            const container = document.getElementById('expList');
            if (!experiences || experiences.length === 0) {
                container.innerHTML = '<div class="empty-state">No experience records found.</div>';
                return;
            }
            container.innerHTML = experiences.map(exp => `
                <div class="timeline-item">
                    <div class="item-actions">
                        <button onclick="deleteExp(${exp.id})" class="btn btn-sm btn-danger">Delete</button>
                    </div>
                    <h4 style="margin:0; color: var(--secondary-color);">${exp.jobTitle}</h4>
                    <p style="margin: 0.2rem 0; font-weight: 500; color: var(--primary-color);">${exp.company}</p>
                    <p class="text-muted" style="margin: 0; font-size: 0.9rem;">
                        ${exp.startDate} to ${exp.isCurrent ? 'Present' : exp.endDate}
                    </p>
                    <p style="margin-top: 0.5rem; font-size: 0.9rem;">${exp.description || ''}</p>
                </div>
            `).join('');
        }

        document.getElementById('expForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                company: document.getElementById('company').value,
                jobTitle: document.getElementById('jobTitle').value,
                startDate: document.getElementById('startDate').value,
                endDate: document.getElementById('endDate').value || null,
                isCurrent: document.getElementById('isCurrent').checked,
                description: document.getElementById('description').value
            };

            try {
                const response = await fetch(`/api/candidates/${currentUser.id}/experience`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    document.getElementById('expForm').reset();
                    document.getElementById('endDate').disabled = false;
                    showAlert('Experience added successfully!', 'success');
                    currentUser = await checkAuth(); // Refresh UI
                    renderExperience(currentUser.experiences);
                } else {
                    showAlert('Failed to add experience.');
                }
            } catch (error) {
                showAlert('An error occurred.');
            }
        });

        async function deleteExp(id) {
            if(!confirm('Are you sure?')) return;
            try {
                const response = await fetch(`/api/candidates/${currentUser.id}/experience/${id}`, { method: 'DELETE' });
                if(response.ok) {
                    showAlert('Deleted', 'success');
                    currentUser = await checkAuth();
                    renderExperience(currentUser.experiences);
                }
            } catch (error) {
                showAlert('Error deleting');
            }
        }
    </script>
</body>
</html>
