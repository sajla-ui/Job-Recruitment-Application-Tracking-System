<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Interviews - Career X</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/careerx.css">

    <style>

        /* =====================================================
           CAREER X LOGO
           ===================================================== */

        .careerx-logo {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 8px 10px 28px;
        }

        .careerx-logo-icon {
            width: 54px;
            height: 54px;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #22d3ee 0%,
                    #38bdf8 45%,
                    #6366f1 100%
                );

            color: #020617;

            font-size: 25px;
            font-weight: 950;

            box-shadow:
                0 0 25px rgba(34, 211, 238, 0.22),
                0 8px 25px rgba(37, 99, 235, 0.18);
        }

        .careerx-logo-text {
            color: #f8fafc;

            font-size: 1.8rem;

            font-weight: 900;

            letter-spacing: -0.045em;

            white-space: nowrap;
        }

        .careerx-logo-text span {
            color: #22d3ee;

            font-weight: 900;
        }


        /* =====================================================
           PAGE BACKGROUND
           ===================================================== */

        body {
            overflow-x: hidden;
        }

        .interviews-background {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
        }

        .interviews-grid {
            position: absolute;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(56, 189, 248, 0.035) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(56, 189, 248, 0.035) 1px,
                    transparent 1px
                );

            background-size: 55px 55px;

            mask-image:
                linear-gradient(
                    to bottom,
                    black,
                    transparent 90%
                );
        }

        .interviews-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.18;
        }

        .orb-one {
            width: 350px;
            height: 350px;
            background: #06b6d4;
            top: -120px;
            right: -100px;
        }

        .orb-two {
            width: 300px;
            height: 300px;
            background: #8b5cf6;
            bottom: -100px;
            left: -100px;
        }


        /* =====================================================
           CONTENT
           ===================================================== */

        .interviews-content {
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-subtitle {
            margin-top: 7px;
            color: var(--text-muted);
            font-size: 0.92rem;
        }


        /* =====================================================
           INTERVIEW CARD
           ===================================================== */

        .interview-card {

            position: relative;

            background:
                linear-gradient(
                    145deg,
                    rgba(15, 23, 42, 0.92),
                    rgba(8, 15, 30, 0.82)
                );

            border: 1px solid var(--border);

            border-radius: 18px;

            padding: 25px;

            margin-bottom: 20px;

            transition:
                transform 0.3s ease,
                border-color 0.3s ease,
                box-shadow 0.3s ease;

            overflow: hidden;
        }

        .interview-card::before {

            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 2px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #06b6d4,
                    #8b5cf6,
                    transparent
                );

            opacity: 0.65;
        }

        .interview-card:hover {

            transform: translateY(-3px);

            border-color:
                rgba(56, 189, 248, 0.35);

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.25);
        }


        /* =====================================================
           CARD HEADER
           ===================================================== */

        .interview-header {

            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 20px;

            margin-bottom: 20px;
        }

        .job-title {

            font-size: 1.3rem;

            font-weight: 750;

            color: var(--text);

            margin-bottom: 7px;
        }

        .company-name {

            color: var(--cyan);

            font-size: 0.9rem;

            font-weight: 600;
        }


        /* =====================================================
           STATUS
           ===================================================== */

        .interview-status {

            padding: 7px 14px;

            border-radius: 999px;

            font-size: 0.78rem;

            font-weight: 700;

            white-space: nowrap;

            letter-spacing: 0.2px;
        }

        .status-scheduled {

            background:
                rgba(6, 182, 212, 0.10);

            color: #67e8f9;

            border:
                1px solid
                rgba(6, 182, 212, 0.28);

            box-shadow:
                0 0 14px
                rgba(6, 182, 212, 0.06);
        }

        .status-completed {

            background:
                rgba(34, 197, 94, 0.10);

            color: #86efac;

            border:
                1px solid
                rgba(34, 197, 94, 0.28);
        }

        .status-cancelled {

            background:
                rgba(239, 68, 68, 0.10);

            color: #fca5a5;

            border:
                1px solid
                rgba(239, 68, 68, 0.28);
        }


        /* =====================================================
           DETAILS
           ===================================================== */

        .interview-details {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 14px;

            margin-top: 18px;
        }

        .detail-box {

            background:
                rgba(15, 23, 42, 0.60);

            border:
                1px solid
                rgba(148, 163, 184, 0.10);

            border-radius: 12px;

            padding: 15px 16px;

            transition:
                border-color 0.25s ease,
                background 0.25s ease;
        }

        .detail-box:hover {

            border-color:
                rgba(56, 189, 248, 0.20);

            background:
                rgba(15, 23, 42, 0.78);
        }

        .detail-label {

            display: block;

            color: var(--text-muted);

            font-size: 0.68rem;

            margin-bottom: 7px;

            text-transform: uppercase;

            letter-spacing: 0.7px;

            font-weight: 650;
        }

        .detail-value {

            color: var(--text);

            font-size: 0.9rem;

            font-weight: 550;

            line-height: 1.45;

            word-break: break-word;
        }


        /* =====================================================
           MEETING LINK
           ===================================================== */

        .meeting-link {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            margin-top: 18px;

            padding: 10px 17px;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #06b6d4,
                    #2563eb
                );

            color: white;

            text-decoration: none;

            font-size: 0.88rem;

            font-weight: 700;

            box-shadow:
                0 8px 25px
                rgba(6, 182, 212, 0.15);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .meeting-link:hover {

            transform: translateY(-2px);

            box-shadow:
                0 12px 30px
                rgba(6, 182, 212, 0.25);
        }


        /* =====================================================
           NOTES
           ===================================================== */

        .notes-box {

            margin-top: 18px;

            padding: 15px 17px;

            border-left:
                3px solid #8b5cf6;

            background:
                rgba(139, 92, 246, 0.06);

            border-radius: 8px;

            border-top:
                1px solid
                rgba(139, 92, 246, 0.08);

            border-right:
                1px solid
                rgba(139, 92, 246, 0.08);

            border-bottom:
                1px solid
                rgba(139, 92, 246, 0.08);
        }

        .notes-box strong {

            display: block;

            margin-bottom: 7px;

            color: #c4b5fd;

            font-size: 0.86rem;
        }

        .notes-box p {

            margin: 0;

            color: var(--text-muted);

            font-size: 0.86rem;

            line-height: 1.6;

            white-space: pre-wrap;
        }


        /* =====================================================
           EMPTY STATE
           ===================================================== */

        .empty-state {

            text-align: center;

            padding: 70px 20px;

            color: var(--text-muted);
        }

        .empty-icon {

            width: 70px;
            height: 70px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin: 0 auto 18px;

            border-radius: 20px;

            background:
                rgba(6, 182, 212, 0.08);

            border:
                1px solid
                rgba(6, 182, 212, 0.18);

            font-size: 32px;

            box-shadow:
                0 0 30px
                rgba(6, 182, 212, 0.06);
        }

        .empty-state h2 {

            color: var(--text);

            margin-bottom: 8px;

            font-size: 1.2rem;
        }

        .empty-state p {

            margin: 0;

            font-size: 0.9rem;
        }


        /* =====================================================
           LOADING
           ===================================================== */

        .loading {

            text-align: center;

            padding: 60px 20px;

            color: var(--text-muted);

            font-size: 0.9rem;
        }

        .loading::before {

            content: "✦";

            display: block;

            margin-bottom: 12px;

            font-size: 25px;

            color: var(--cyan);

            animation:
                pulseGlow 1.2s infinite alternate;
        }

        @keyframes pulseGlow {

            from {
                opacity: 0.35;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1.1);
            }
        }


        /* =====================================================
           ERROR
           ===================================================== */

        .error-message {

            background:
                rgba(239, 68, 68, 0.08);

            border:
                1px solid
                rgba(239, 68, 68, 0.25);

            color: #fca5a5;

            padding: 14px 16px;

            border-radius: 10px;

            margin-bottom: 20px;

            display: none;

            font-size: 0.88rem;
        }


        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (max-width: 850px) {

            .interview-details {

                grid-template-columns: 1fr;

            }

        }

        @media (max-width: 700px) {

            .interview-header {

                flex-direction: column;

            }

            .interview-status {

                align-self: flex-start;

            }

            .interview-card {

                padding: 20px;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         BACKGROUND
         ===================================================== -->

    <div class="interviews-background">

        <div class="interviews-grid"></div>

        <div class="interviews-orb orb-one"></div>

        <div class="interviews-orb orb-two"></div>

    </div>


    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <aside class="sidebar">


        <!-- CAREER X LOGO -->

        <div class="careerx-logo">

            <div class="careerx-logo-icon">
                X
            </div>

            <div class="careerx-logo-text">
                Career <span>X</span>
            </div>

        </div>


        <ul class="sidebar-menu">

            <li>
                <a href="dashboard.html">
                     Dashboard
                </a>
            </li>

            <li>
                <a href="profile.html">
                     Profile Settings
                </a>
            </li>

            <li>
                <a href="jobs.html">
                     Browse Jobs
                </a>
            </li>

            <li>
                <a href="candidate-applications.html">
                     My Applications
                </a>
            </li>

            <li>
                <a
                    href="candidate-interviews.html"
                    class="active">

                     My Interviews

                </a>
            </li>

            <li>

                <a href="#" id="logoutBtn">

                     Logout

                </a>

            </li>

        </ul>

    </aside>


    <!-- =====================================================
         MAIN CONTENT
         ===================================================== -->

    <main class="main-content">

        <header class="header">

            <div>

                <h1 class="page-title">
                    My Interviews
                </h1>

                <p class="page-subtitle">

                    View your scheduled interviews
                    and interview details.

                </p>

            </div>

            <div>

                <span class="user-name-display"></span>

            </div>

        </header>


        <div class="interviews-content">

            <div class="content-card">

                <div
                    id="errorMessage"
                    class="error-message">
                </div>


                <div
                    id="loadingMessage"
                    class="loading">

                    Loading your interviews...

                </div>


                <div
                    id="interviewsContainer">
                </div>

            </div>

        </div>

    </main>


    <script src="js/app.js"></script>


    <script>


        // =====================================================
        // LOAD INTERVIEWS
        // =====================================================

        async function loadInterviews() {


            const container =
                document.getElementById(
                    "interviewsContainer"
                );


            const loading =
                document.getElementById(
                    "loadingMessage"
                );


            const errorMessage =
                document.getElementById(
                    "errorMessage"
                );


            const candidateId =
                localStorage.getItem(
                    "candidateId"
                );


            if (!candidateId) {

                window.location.href =
                    "index.html";

                return;

            }


            try {

                const response =
                    await fetch(
                        `/api/interviews/candidate/${candidateId}`
                    );


                if (!response.ok) {

                    let errorText =
                        "Unable to load interviews.";


                    try {

                        const errorData =
                            await response.json();

                        errorText =
                            errorData.message ||
                            errorText;

                    }

                    catch (e) {}


                    throw new Error(
                        errorText
                    );

                }


                const interviews =
                    await response.json();


                loading.style.display =
                    "none";


                if (
                    !interviews ||
                    interviews.length === 0
                ) {

                    container.innerHTML = `

                        <div class="empty-state">

                            <div class="empty-icon">
                                📅
                            </div>

                            <h2>
                                No Interviews Yet
                            </h2>

                            <p>

                                You don't have any
                                scheduled interviews
                                at the moment.

                            </p>

                        </div>

                    `;

                    return;

                }


                /*
                 * Sort interviews by interview date.
                 * Upcoming interviews appear first.
                 */

                interviews.sort(
                    function(a, b) {

                        return new Date(
                            a.interviewDate
                        ) - new Date(
                            b.interviewDate
                        );

                    }
                );


                container.innerHTML =
                    interviews
                        .map(createInterviewCard)
                        .join("");


            }

            catch (error) {

                console.error(
                    "Error loading interviews:",
                    error
                );


                loading.style.display =
                    "none";


                errorMessage.textContent =
                    error.message ||
                    "Unable to load interviews.";


                errorMessage.style.display =
                    "block";

            }

        }


        // =====================================================
        // CREATE INTERVIEW CARD
        // =====================================================

        function createInterviewCard(
            interview
        ) {


            const status =
                interview.status ||
                "Scheduled";


            let statusClass =
                "status-scheduled";


            if (status === "Completed") {

                statusClass =
                    "status-completed";

            }

            else if (status === "Cancelled") {

                statusClass =
                    "status-cancelled";

            }


            const interviewDate =
                formatDateTime(
                    interview.interviewDate
                );


            const appliedDate =
                interview.appliedDate
                    ? formatDate(
                        interview.appliedDate
                    )
                    : "Not available";


            // =================================================
            // INTERVIEW MODE
            // =================================================

            let modeText = "";


            if (
                interview.mode &&
                interview.mode.toLowerCase() ===
                "online"
            ) {

                modeText =
                    "💻 Online";

            }

            else {

                modeText =
                    "🏢 Offline";

            }


            // =================================================
            // LOCATION
            // =================================================

            let locationDetails = "";


            if (interview.location) {

                locationDetails = `

                    <div class="detail-box">

                        <span class="detail-label">
                            Location
                        </span>

                        <span class="detail-value">

                            ${escapeHtml(
                                interview.location
                            )}

                        </span>

                    </div>

                `;

            }


            // =================================================
            // MEETING LINK
            // =================================================

            let meetingLink = "";


            if (
                interview.meetingLink &&
                interview.mode &&
                interview.mode.toLowerCase() ===
                "online"
            ) {

                meetingLink = `

                    <a
                        href="${escapeAttribute(
                            interview.meetingLink
                        )}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="meeting-link">

                        🔗 Join Interview

                    </a>

                `;

            }


            // =================================================
            // NOTES
            // =================================================

            let notes = "";


            if (interview.notes) {

                notes = `

                    <div class="notes-box">

                        <strong>
                            📝 Interview Notes
                        </strong>

                        <p>

                            ${escapeHtml(
                                interview.notes
                            )}

                        </p>

                    </div>

                `;

            }


            // =================================================
            // RETURN CARD
            // =================================================

            return `

                <div class="interview-card">


                    <div class="interview-header">


                        <div>

                            <div class="job-title">

                                ${escapeHtml(
                                    interview.jobTitle ||
                                    "Job Position"
                                )}

                            </div>


                            <div class="company-name">

                                ${escapeHtml(
                                    interview.companyName ||
                                    "Company"
                                )}

                            </div>

                        </div>


                        <span
                            class="interview-status
                            ${statusClass}">

                            ${escapeHtml(status)}

                        </span>


                    </div>


                    <div class="interview-details">


                        <!-- INTERVIEW DATE -->

                        <div class="detail-box">

                            <span class="detail-label">

                                Interview Date & Time

                            </span>

                            <span class="detail-value">

                                📅 ${interviewDate}

                            </span>

                        </div>


                        <!-- INTERVIEW MODE -->

                        <div class="detail-box">

                            <span class="detail-label">

                                Mode

                            </span>

                            <span class="detail-value">

                                ${modeText}

                            </span>

                        </div>


                        ${locationDetails}


                        <!-- APPLICATION ID -->

                        <div class="detail-box">

                            <span class="detail-label">

                                Application ID

                            </span>

                            <span class="detail-value">

                                #${interview.applicationId || "N/A"}

                            </span>

                        </div>


                        <!-- APPLIED DATE -->

                        <div class="detail-box">

                            <span class="detail-label">

                                Applied Date

                            </span>

                            <span class="detail-value">

                                ${appliedDate}

                            </span>

                        </div>


                    </div>


                    ${meetingLink}


                    ${notes}


                </div>

            `;

        }


        // =====================================================
        // FORMAT DATE + TIME
        // =====================================================

        function formatDateTime(
            dateString
        ) {


            if (!dateString) {

                return "Not available";

            }


            const date =
                new Date(dateString);


            if (isNaN(date.getTime())) {

                return dateString;

            }


            return date.toLocaleString(
                "en-IN",
                {
                    day: "2-digit",
                    month: "short",
                    year: "numeric",
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

        }


        // =====================================================
        // FORMAT DATE
        // =====================================================

        function formatDate(
            dateString
        ) {


            if (!dateString) {

                return "Not available";

            }


            const date =
                new Date(dateString);


            if (isNaN(date.getTime())) {

                return dateString;

            }


            return date.toLocaleDateString(
                "en-IN",
                {
                    day: "2-digit",
                    month: "short",
                    year: "numeric"
                }
            );

        }


        // =====================================================
        // ESCAPE HTML
        // =====================================================

        function escapeHtml(value) {


            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }


            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        // =====================================================
        // ESCAPE ATTRIBUTE
        // =====================================================

        function escapeAttribute(
            value
        ) {


            if (!value) {

                return "";

            }


            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                );

        }


        // =====================================================
        // PAGE INITIALIZATION
        // =====================================================

        document.addEventListener(
            "DOMContentLoaded",
            async function() {

                /*
                 * Make sure the candidate is logged in.
                 * app.js also updates the candidate name.
                 */

                await checkAuth();

                loadInterviews();

            }
        );

    </script>
    

</body>

</html>
